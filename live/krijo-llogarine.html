<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=393">
<title>Krijo llogarinë frames</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kidocare.css">
</head>
<body>
<div id="f"></div>
<script src="kidocare.js"></script>
<script>
const c=h=>`<div class="crop au-c bg">${h}</div>`;
const ERR_REQ='Plotësoni fushat e detyrueshme për të vazhduar.';
/* the parent form; o lets every field take any state */
function form(o={}){
  return auPage(`${auTop()}<h1>Krijo llogarinë</h1>${auSeg('prind')}
   ${o.name||auField('Emri i plotë')}
   ${o.phone||auPhone()}
   ${o.email||auField('Email (opsionale)')}
   ${o.pass||auPass()}
   ${o.terms||auTerms()}
   ${auCta('Krijo llogarinë',{link:['Kam llogari?','Hyr'],...(o.cta||{})})}`);
}
const filled={name:auField('Emri i plotë',{v:KLEA.name}),phone:auPhone({v:KLEA.phone,st:'ok'}),email:auField('Email (opsionale)',{v:KLEA.email}),pass:auPass({v:'kidocare26',hst:'ok'}),terms:auTerms('on')};
/* doctor application */
function pedForm(o={}){
  return `<div class="au bg" style="padding-bottom:34px">${statusBar()}${auTop()}<h1>Krijo llogarinë</h1>${auSeg('ped')}
   ${o.name||auField('Emri i plotë')}
   ${o.phone||auPhone()}
   ${o.email||auField('Email')}
   ${o.lic||auField('Numri i licencës',{ph:'Urdhri i Mjekut, nr.'})}
   <div class="au-f"><label>Foto e licencës</label>${o.up||`<div class="au-up">${I('cam')}Fotografoni ose ngarkoni licencën</div>`}</div>
   ${o.pass||auPass()}
   ${o.terms||auTerms()}
   <div class="au-cta flow">${o.err?`<div class="au-ferr">${o.err}</div>`:''}<div class="au-btn">Dërgo aplikimin</div><div class="au-link">Kam llogari? <b>Hyr</b></div></div></div>`;
}
const upDone=`<div class="au-upd"><span class="th"></span><div><b>Licenca.jpg</b><small>Foto, 1.8 MB</small></div><span class="rm">${I('x')}</span></div>`;
const upBusy=`<div class="au-upd"><span class="th"></span><div style="flex:1"><b>Licenca.jpg</b><small>Duke ngarkuar</small><div class="bar"><i></i></div></div></div>`;
const pedFilled={name:auField('Emri i plotë',{v:'Blerina Kola'}),phone:auPhone({v:'68 220 4519',st:'ok'}),email:auField('Email',{v:'blerina.kola@gmail.com'}),lic:auField('Numri i licencës',{v:'1937'}),up:upDone,pass:auPass({v:'pediatri2026',hst:'ok'}),terms:auTerms('on')};
const countrySheet=()=>`<div style="position:relative">${form()}${bsheet(`<div class="stitle">Zgjidhni shtetin</div><div class="au-search">${I('search')}Kërkoni shtetin</div>
  <div class="au-cl">${[['al','Shqipëri','+355',1],['xk','Kosovë','+383'],['mk','Maqedoni e Veriut','+389'],['me','Mal i Zi','+382'],['it','Itali','+39'],['gr','Greqi','+30'],['de','Gjermani','+49'],['gb','Mbretëri e Bashkuar','+44']]
   .map(([f,n,cc,on])=>`<div class="${on?'on':''}"><span class="au-flag ${f}"></span>${n}<em>${cc}</em></div>`).join('')}</div>`)}</div>`;
const F={
 /* minimal path */
 'path-1':()=>form(),
 'path-2':()=>form(filled),
 'path-3':()=>auCodePage(),
 'path-4':()=>auDone('check','g','Mirë se erdhët, Klea','Llogaria u krijua. Shtoni fëmijën tuaj për të filluar.','Shto fëmijën'),
 /* whole screen */
 'screen-min':()=>form(),
 'screen-full':()=>form(filled),
 'screen-err':()=>form({name:auField('Emri i plotë',{st:'err'}),phone:auPhone({v:'69 412',st:'err',help:['Numri duhet të ketë 9 shifra.','err']}),pass:auPass({st:'err',hst:'err'}),terms:auTerms('err'),cta:{err:ERR_REQ}}),
 /* role */
 'role-prind':()=>c(auSeg('prind')),
 'role-ped':()=>c(auSeg('ped')),
 /* name */
 'name-empty':()=>c(auField('Emri i plotë')),
 'name-focus':()=>c(auField('Emri i plotë',{v:'Klea Le',caret:1,st:'focus'})),
 'name-filled':()=>c(auField('Emri i plotë',{v:KLEA.name})),
 'name-long':()=>c(auField('Emri i plotë',{v:'Valbona Xhaferraj-Gjonbalaj Marjeta'})),
 'name-err':()=>c(auField('Emri i plotë',{st:'err'})),
 /* phone */
 'ph-empty':()=>c(auPhone()),
 'ph-typing':()=>c(auPhone({v:'69 412',caret:1,st:'focus'})),
 'ph-ok':()=>c(auPhone({v:KLEA.phone,st:'ok'})),
 'ph-short':()=>c(auPhone({v:'69 412',st:'err',help:['Numri duhet të ketë 9 shifra.','err']})),
 'ph-wrong':()=>c(auPhone({v:'42 123 4567',st:'err',help:['Numri celular fillon me 6.','err']})),
 'ph-taken':()=>c(auPhone({v:KLEA.phone,st:'err',help:['Ky numër ka tashmë një llogari. <b>Hyr</b>','err']})),
 'ph-sheet':()=>countrySheet(),
 'ph-xk':()=>c(auPhone({cc:'xk'})),
 /* email */
 'em-empty':()=>c(auField('Email (opsionale)')),
 'em-ok':()=>c(auField('Email (opsionale)',{v:KLEA.email})),
 'em-err':()=>c(auField('Email (opsionale)',{v:'klea.leka@gmail',st:'err',help:['Email-i nuk është i saktë.','err']})),
 /* password */
 'pw-empty':()=>c(auPass()),
 'pw-typing':()=>c(auPass({v:'kido2',caret:1,st:'focus'})),
 'pw-ok':()=>c(auPass({v:'kidocare26',hst:'ok'})),
 'pw-shown':()=>c(auPass({v:'kidocare26',shown:1,hst:'ok'})),
 'pw-err':()=>c(auPass({v:'kido2',st:'err',hst:'err'})),
 /* terms */
 't-off':()=>c(auTerms()),
 't-on':()=>c(auTerms('on')),
 't-err':()=>c(auTerms('err')),
 /* button */
 'cta-default':()=>c(auCta('Krijo llogarinë',{link:['Kam llogari?','Hyr']})),
 'cta-err':()=>c(auCta('Krijo llogarinë',{err:ERR_REQ,link:['Kam llogari?','Hyr']})),
 'cta-busy':()=>c(auCta('',{busy:'Duke krijuar llogarinë',link:['Kam llogari?','Hyr']})),
 'cta-net':()=>c(auCta('Krijo llogarinë',{err:'Pa lidhje me internetin. Provoni përsëri.',link:['Kam llogari?','Hyr']})),
 /* SMS */
 'code-empty':()=>auCodePage(),
 'code-typing':()=>auCodePage({d:'482'}),
 'code-busy':()=>auCodePage({d:'482915',busy:1}),
 'code-err':()=>auCodePage({d:'482916',st:'err'}),
 'code-expired':()=>auCodePage({d:'482915',st:'err',errText:'Kodi ka skaduar.',resend:'<b>Dërgo kodin përsëri</b>'}),
 'code-resend':()=>auCodePage({resend:'Nuk ju erdhi? <b>Dërgo kodin përsëri</b>'}),
 /* done */
 'done':()=>auDone('check','g','Mirë se erdhët, Klea','Llogaria u krijua. Shtoni fëmijën tuaj për të filluar.','Shto fëmijën'),
 /* doctor application */
 'ped-empty':()=>pedForm(),
 'ped-full':()=>pedForm(pedFilled),
 'ped-err':()=>pedForm({name:auField('Emri i plotë',{v:'Blerina Kola'}),phone:auPhone({st:'err'}),email:auField('Email',{st:'err'}),lic:auField('Numri i licencës',{st:'err',ph:'Urdhri i Mjekut, nr.'}),up:`<div class="au-up err">${I('cam')}Fotografoni ose ngarkoni licencën</div>`,terms:auTerms('err'),err:ERR_REQ}),
 'up-empty':()=>c(`<div class="au-f"><label>Foto e licencës</label><div class="au-up">${I('cam')}Fotografoni ose ngarkoni licencën</div></div>`),
 'up-busy':()=>c(`<div class="au-f"><label>Foto e licencës</label>${upBusy}</div>`),
 'up-done':()=>c(`<div class="au-f"><label>Foto e licencës</label>${upDone}</div>`),
 'up-fail':()=>c(`<div class="au-f"><label>Foto e licencës</label><div class="au-up err">${I('cam')}Fotografoni ose ngarkoni licencën</div><div class="au-help err">Foto nuk u ngarkua. Provoni përsëri.</div></div>`),
 'ped-sent':()=>auDone('mailsent','b','Aplikimi u dërgua','Do ta verifikojmë licencën tuaj dhe do t\'ju njoftojmë me SMS te +355 68 220 4519.','Kthehu në fillim'),
};
window.FRAME_IDS=Object.keys(F);
function show(){
  const id=location.hash.slice(1)||'path-1';
  document.getElementById('f').innerHTML=(F[id]||F['path-1'])();
  const post=()=>{try{parent.postMessage({liveFrame:id,h:document.getElementById('f').scrollHeight},'*')}catch(e){}};
  requestAnimationFrame(post);document.querySelectorAll('#f img').forEach(i=>i.complete||i.addEventListener('load',post));
}
addEventListener('hashchange',show);show();
document.fonts&&document.fonts.ready.then(show);
</script>
</body>
</html>
