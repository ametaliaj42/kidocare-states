<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=393">
<title>Krijo llogarinë frames</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kidocare.css">
<style>
/* Pediatër form, pending account, confirm number */

.au-in .chev{margin-left:auto;color:var(--muted)}
.pd-docs{background:#fff;border-radius:20px;box-shadow:0 4px 12px rgba(40,80,160,.05);overflow:hidden}
.pd-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.pd-row:last-child{border:0}
.pd-row .ic{width:38px;height:38px;border-radius:19px;background:var(--blue-fill);color:var(--blue-ink);display:grid;place-items:center;flex:none}
.pd-row .ic svg{width:18px;height:18px}
.pd-row .tx{flex:1;min-width:0}
.pd-row .tx b{display:block;font-size:15.5px;font-weight:600}
.pd-row .tx small{display:block;font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pd-row .act{font-size:15px;font-weight:600;color:var(--blue-ink)}
.pd-row .x{color:var(--muted)}
.pd-row.ok .ic{background:var(--green-fill);color:var(--green)}
.pd-row.err .act{color:var(--red)}
.pd-row.err .tx small{color:var(--red)}
.pd-row .bar{height:5px;border-radius:3px;background:var(--track);margin-top:7px;overflow:hidden}.pd-row .bar i{display:block;height:100%;width:55%;background:var(--blue);border-radius:3px}
.pd-docs.err{box-shadow:0 0 0 1.6px var(--red)}
.pd-vlist{margin:6px 0 22px}
.pd-vrow{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:15.5px}
.pd-vrow:last-child{border:0}
.pd-vrow i{width:36px;height:36px;border-radius:18px;background:var(--blue-fill);color:var(--blue-ink);display:grid;place-items:center;flex:none}
.pd-vrow i svg{width:18px;height:18px}
.bs .au-btn{margin-top:4px}
.sico{width:56px;height:56px;border-radius:28px;background:var(--green-fill);color:var(--green);display:grid;place-items:center;margin:6px 0 14px}
.sico svg{width:26px;height:26px;stroke-width:2.2}
.pend{padding-top:8px}
.pend{margin:auto 0;padding:0;text-align:center}
.pend h1{margin:0 0 22px;text-align:left}
.pend .lead{margin:18px 8px 0}
.pend .pcard{text-align:left}
.ptitle{font-size:14px;color:var(--muted);margin:0 0 8px}
.prow span small{display:block;font-size:13px;color:var(--red);font-weight:400;margin-top:2px}
.prow em.r{color:var(--red);background:#FDE8EC}
.prow i.ok{background:var(--green-fill);color:var(--green)}
.prow i.no{background:#FDE8EC;color:var(--red)}
.prow{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.prow:last-child{border:0}
.prow i{width:38px;height:38px;border-radius:19px;background:var(--blue-fill);color:var(--blue-ink);display:grid;place-items:center;flex:none}
.prow i svg{width:18px;height:18px}
.prow span{flex:1;font-size:15.5px;font-weight:500}
.prow em{font-style:normal;font-size:13px;font-weight:600;color:var(--amber);background:var(--amber-fill);border-radius:10px;padding:4px 10px}
.prow em.g{color:var(--green);background:var(--green-fill)}
.pcard{background:#fff;border-radius:20px;box-shadow:0 4px 12px rgba(40,80,160,.05);overflow:hidden}
.sub2{font-size:14.5px;color:var(--muted);margin-top:16px;line-height:1.4}
.ps{margin-top:92px;padding:0 10px;text-align:center;height:166px;display:flex;flex-direction:column;align-items:center}
.ps-ic{flex:none;width:64px;height:64px;border-radius:32px;display:grid;place-items:center}
.ps-ic svg{width:26px;height:26px;stroke-width:2}
.ps h2{font-size:26px;font-weight:600;letter-spacing:-.01em;margin-top:14px}
.ps p{font-size:16px;color:var(--muted);line-height:1.4;margin-top:6px;max-width:290px}
.ps{background:none}.ps.w .ps-ic{background:var(--amber-fill);color:var(--amber)}
.ps.r .ps-ic{background:#FDE8EC;color:var(--red)}
.ps.g .ps-ic{background:var(--green-fill);color:var(--green)}
.ptitle2{font-size:14px;color:var(--muted);margin:24px 0 8px}
.au-btn.ghost{visibility:hidden}



.cv{min-height:852px;display:flex;flex-direction:column;padding:0 20px;position:relative}
.cv .sb{margin:0 -20px}
.cv h1{font-size:30px;font-weight:600;letter-spacing:-.02em;margin:22px 0 0}
.cn-num{display:flex;align-items:center;gap:6px;margin-top:14px;font-size:17px}
.cn-num b{color:var(--ink);font-weight:600}
.cn-num .ed{color:var(--muted);display:grid;place-items:center}
.cn-num .ed svg{width:19px;height:19px;stroke-width:2}
.cn-boxes{display:flex;gap:9px;margin-top:30px}
.cn-boxes span{flex:1;height:62px;border-radius:16px;background:#fff;display:grid;place-items:center;font-size:27px;font-weight:600;box-shadow:0 4px 12px rgba(40,80,160,.05)}
.cn-boxes span.f{box-shadow:0 0 0 1.6px var(--blue),0 0 0 5px rgba(91,150,255,.15)}
.cn-boxes span.f::after{content:"";width:1.6px;height:26px;background:var(--blue)}
.cn-boxes.ok span{box-shadow:0 0 0 1.6px var(--green);color:var(--green)}
.cn-boxes.busy span{color:var(--muted)}
.cn-msg{font-size:14px;margin-top:14px;min-height:20px;color:var(--muted);display:flex;align-items:center;gap:7px}
.cn-msg.err{color:var(--red)}
.cn-msg b{color:var(--blue-ink);font-weight:600}
.cn-msg .sp{width:15px;height:15px;border-radius:50%;border:2px solid #C9D6EE;border-top-color:var(--blue)}
.cn-msg svg{width:15px;height:15px}
.cn-ch{height:34px;padding:0 14px;border-radius:17px;background:#fff;color:var(--blue-ink);font-size:14.5px;font-weight:600;display:grid;place-items:center;box-shadow:0 4px 12px rgba(40,80,160,.06)}
.cn-rs{height:52px;border-radius:16px;background:rgba(255,255,255,.55);color:var(--muted);font-size:16px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px}
.cn-rs b{font-size:18px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;min-width:40px}
.cn-rs.on{background:#fff;color:var(--blue-ink);font-weight:600;box-shadow:0 8px 20px rgba(40,80,160,.08)}

.cn-msg b.tm{color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums}


/* Jeni pediatër? chip and password confirmation (22.11.2026) */
.kl-ped{margin-left:auto;display:flex;align-items:center;gap:6px;height:36px;padding:0 13px 0 11px;border-radius:18px;background:#fff;color:var(--ink);font-size:14.5px;font-weight:500;box-shadow:0 4px 12px rgba(40,80,160,.06)}
.kl-ped svg{width:17px;height:17px;color:var(--blue-ink)}
.au-top.kl-alone{padding-left:0}
</style>
</head>
<body>
<div id="f"></div>
<script src="kidocare.js"></script>
<script>
const c=h=>`<div class="crop au-c bg">${h}</div>`;
const ERR_REQ='Plotësoni fushat e detyrueshme për të vazhduar.';
/* the parent form; o lets every field take any state */
const klTop=()=>`<div class="au-top"><span class="back">${I('back')}</span><img class="lg" src="img/logo-kidocare.png" alt="KidoCare"><span class="kl-ped">${I('steth')}Jeni pediatër?</span></div>`;
const klPed=()=>`<div class="au-top kl-alone"><span class="kl-ped" style="margin-left:0">${I('steth')}Jeni pediatër?</span></div>`;
/* confirm password: same field as Fjalëkalimi, a check once it matches */
function auConf(o={}){
  const v=o.v?`<span class="v" style="letter-spacing:2px">${'•'.repeat(o.v)}</span>`:`<span class="ph"></span>`;
  const help=o.help?`<div class="au-help err">${o.help}</div>`:'';
  return `<div class="au-f"><label>Konfirmoni fjalëkalimin</label><div class="au-in pw ${o.st||''}">${v}${o.st==='ok'?`<span class="ok">${I('check')}</span>`:''}${I('eye')}</div>${help}</div>`;
}
function form(o={}){
  return auPage(`${klTop()}<h1>Krijo llogarinë</h1>
   ${o.name||auField('Emri i plotë')}
   ${o.phone||auPhone()}
   ${o.email||auField('Email (opsionale)')}
   ${o.pass||auPass()}
   ${o.conf||auConf()}
   ${o.terms||auTerms()}
   ${auCta('Krijo llogarinë',{link:['Kam llogari?','Hyr'],...(o.cta||{})})}`);
}
const filled={name:auField('Emri i plotë',{v:KLEA.name}),phone:auPhone({v:KLEA.phone,st:'ok'}),email:auField('Email (opsionale)',{v:KLEA.email}),pass:auPass({v:'kidocare26',hst:'ok'}),conf:auConf({v:10,st:'ok'}),terms:auTerms('on')};
const countrySheet=()=>`<div style="position:relative">${form()}${bsheet(`<div class="stitle">Zgjidhni shtetin</div><div class="au-search">${I('search')}Kërkoni shtetin</div>
  <div class="au-cl">${[['al','Shqipëri','+355',1],['xk','Kosovë','+383'],['mk','Maqedoni e Veriut','+389'],['me','Mal i Zi','+382'],['it','Itali','+39'],['gr','Greqi','+30'],['de','Gjermani','+49'],['gb','Mbretëri e Bashkuar','+44']]
   .map(([f,n,cc,on])=>`<div class="${on?'on':''}"><span class="au-flag ${f}"></span>${n}<em>${cc}</em></div>`).join('')}</div>`)}</div>`;
/* ---- Konfirmoni numrin ---- */

P.pen2='<path d="M4 20h4L19 9l-4-4L4 16z"/>';
P.del='<path d="M21 6H9l-6 6 6 6h12z"/><path d="M17 10l-4 4M13 10l4 4"/>';
function codeScr(o={}){
  const d=o.d||'';const cells=[0,1,2,3,4,5].map(i=>`<span class="${!o.st&&i===d.length?'f':''}">${d[i]||''}</span>`).join('');
  const rs=`<div class="cn-rs on">Dërgo kodin përsëri</div>`;
  return `<div class="cv bg">${statusBar()}<div class="au-top"><span class="back">${I('back')}</span><img class="lg" src="img/logo-kidocare.png"></div>
   <h1>Konfirmoni numrin</h1>
   <div class="cn-num"><b>+355 69 412 3087</b><span class="ed">${I('pen2')}</span></div>
   <div class="cn-boxes ${o.st||''}">${cells}</div>
   <div class="cn-msg ${o.mc||''}">${o.msg===undefined?'Kodi skadon pas <b class="tm">0:42</b>':o.msg}</div>
   ${o.st==='ok'||o.st==='busy'?'':rs}</div>`;
}
const CF={
 wait:()=>codeScr(),
 typing:()=>codeScr({d:'482'}),
 busy:()=>codeScr({d:'482915',st:'busy',msg:'<span class="sp"></span>Duke konfirmuar'}),
 wrong:()=>codeScr({d:'',msg:'Kodi nuk është i saktë.',mc:'err'}),
 expired:()=>codeScr({d:'',msg:'Kodi ka skaduar.',mc:'err',ready:1}),
 sent:()=>codeScr({msg:`<span style="color:var(--green);display:flex;gap:6px;align-items:center">${I('check')}Kodi i ri u dërgua. Skadon pas <b class="tm" style="color:var(--ink)">1:00</b></span>`}),
 ok:()=>codeScr({d:'482915',st:'ok',msg:`<span style="color:var(--green);display:flex;gap:6px;align-items:center">${I('check')}Numri u konfirmua</span>`}),
};

const F={
 /* confirm number */
 'path-3':()=>CF.wait(), 'code-wait':()=>CF.wait(), 'code-typing':()=>CF.typing(), 'code-busy':()=>CF.busy(), 'code-wrong':()=>CF.wrong(), 'code-expired':()=>CF.expired(), 'code-sent':()=>CF.sent(), 'code-ok':()=>CF.ok(),

 /* minimal path */
 'path-1':()=>form(),
 'path-2':()=>form(filled),
 /* whole screen */
 'screen-min':()=>form(),
 'screen-full':()=>form(filled),
 'screen-err':()=>form({conf:auConf({st:'err'}),name:auField('Emri i plotë',{st:'err'}),phone:auPhone({v:'69 412',st:'err',help:['Numri duhet të ketë 9 shifra.','err']}),pass:auPass({st:'err',hst:'err'}),terms:auTerms('err'),cta:{err:ERR_REQ}}),
 /* role */
 'ped-chip':()=>c(klPed()),
 'cf-empty':()=>c(auConf()),
 'cf-ok':()=>c(auConf({v:10,st:'ok'})),
 'cf-err':()=>c(auConf({v:9,st:'err',help:'Fjalëkalimet nuk përputhen.'})),
 'screen-mis':()=>form({...filled,conf:auConf({v:9,st:'err',help:'Fjalëkalimet nuk përputhen.'})}),
 /* name */
 'name-empty':()=>c(auField('Emri i plotë')),
 'name-focus':()=>c(auField('Emri i plotë',{v:'Klea Le',caret:1,st:'focus'})),
 'name-filled':()=>c(auField('Emri i plotë',{v:KLEA.name})),
 'name-long':()=>c(auField('Emri i plotë',{v:'Valbona Xhaferraj-Gjonbalaj Marjeta'})),
 'name-err':()=>c(auField('Emri i plotë',{st:'err'})),
 /* phone */
 'ph-empty':()=>c(auPhone()),
 'ph-typing':()=>c(auPhone({v:'69 412',caret:1,st:'focus'})),
 'ph-ok':()=>c(auPhone({v:KLEA.phone,st:'ok'})),
 'ph-short':()=>c(auPhone({v:'69 412',st:'err',help:['Numri duhet të ketë 9 shifra.','err']})),
 'ph-wrong':()=>c(auPhone({v:'42 123 4567',st:'err',help:['Numri celular fillon me 6.','err']})),
 'ph-taken':()=>c(auPhone({v:KLEA.phone,st:'err',help:['Ky numër ka tashmë një llogari.','err']})),
 'ph-sheet':()=>countrySheet(),
 'ph-xk':()=>c(auPhone({cc:'xk'})),
 /* email */
 'em-empty':()=>c(auField('Email (opsionale)')),
 'em-ok':()=>c(auField('Email (opsionale)',{v:KLEA.email})),
 'em-err':()=>c(auField('Email (opsionale)',{v:'klea.leka@gmail',st:'err',help:['Email-i nuk është i saktë.','err']})),
 /* password */
 'pw-empty':()=>c(auPass()),
 'pw-typing':()=>c(auPass({v:'kido2',caret:1,st:'focus'})),
 'pw-ok':()=>c(auPass({v:'kidocare26',hst:'ok'})),
 'pw-shown':()=>c(auPass({v:'kidocare26',shown:1,hst:'ok'})),
 'pw-err':()=>c(auPass({v:'kido2',st:'err',hst:'err'})),
 /* terms */
 't-off':()=>c(auTerms()),
 't-on':()=>c(auTerms('on')),
 't-err':()=>c(auTerms('err')),
 /* button */
 'cta-default':()=>c(auCta('Krijo llogarinë',{link:['Kam llogari?','Hyr']})),
 'cta-err':()=>c(auCta('Krijo llogarinë',{err:ERR_REQ,link:['Kam llogari?','Hyr']})),
 'cta-busy':()=>c(auCta('',{busy:'Duke krijuar llogarinë',link:['Kam llogari?','Hyr']})),
 'cta-net':()=>c(auCta('Krijo llogarinë',{err:'Pa lidhje me internetin. Provoni përsëri.',link:['Kam llogari?','Hyr']})),
};
window.FRAME_IDS=Object.keys(F);
function show(){
  const id=location.hash.slice(1)||'path-1';
  document.getElementById('f').innerHTML=(F[id]||F['path-1'])();
  const post=()=>{try{parent.postMessage({liveFrame:id,h:document.getElementById('f').scrollHeight},'*')}catch(e){}};
  requestAnimationFrame(post);document.querySelectorAll('#f img').forEach(i=>i.complete||i.addEventListener('load',post));
}
addEventListener('hashchange',show);show();
document.fonts&&document.fonts.ready.then(show);
</script>
</body>
</html>
