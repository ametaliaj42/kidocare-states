<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=393">
<title>Regjistrimi i pediatrit frames</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kidocare.css">
<style>
/* Regjistrimi i pediatrit (reworked 22.11.2026): two steps, lab-style documents */
.pr-step{margin-left:auto;font-size:15px;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.pr-step b{color:var(--ink);font-weight:600}
.pr-ldl{margin-top:20px;display:flex;flex-direction:column;gap:12px}
.pr-ld{height:100px;display:flex;align-items:center;gap:14px;padding:0 16px;border-radius:24px;background:#fff;box-shadow:0 10px 30px rgba(40,80,160,.08)}
.pr-ld.e{background:rgba(255,255,255,.55);box-shadow:none;border:1.6px dashed #AEBBD3}
.pr-ld .ub{width:52px;height:64px;border-radius:8px;background:var(--blue-fill);color:var(--blue-ink);display:grid;place-items:center;flex:none}
.pr-ld .ub svg{width:20px;height:20px}
.pr-ld .ub.f{background:var(--grey-fill);color:var(--muted)}
.pr-ld .lt{flex:1;min-width:0}
.pr-ld .lt b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;line-height:1.3}
.pr-ld .lt span{display:block;font-size:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr-ld .lt span.r{color:var(--red)}.pr-ld .lt span.g{color:var(--green);display:flex;align-items:center;gap:4px}.pr-ld .lt span.g svg{width:15px;height:15px}
.pr-ld .la{flex:none;font-size:15px;font-weight:600;color:var(--blue-ink);display:flex;align-items:center;gap:5px}
.pr-ld .la.m{font-size:14px;font-weight:500;color:var(--muted)}.pr-ld .la svg{width:15px;height:15px}
.pr-ld .la.red{color:var(--red)}
.pr-ld .bar2{height:5px;border-radius:3px;background:var(--track);margin-top:9px;overflow:hidden}.pr-ld .bar2 i{display:block;height:100%;width:55%;background:var(--blue);border-radius:3px}
.ovcard .rp{flex:none;font-size:15px;font-weight:600;color:var(--blue-ink);display:flex;align-items:center;gap:6px}.ovcard .rp svg{width:16px;height:16px}
.pr-src{margin-top:8px}
.pr-src div{display:flex;align-items:center;gap:14px;height:58px;border-bottom:1px solid var(--line);font-size:16.5px;font-weight:500}
.pr-src div:last-child{border:0}
.pr-src i{width:40px;height:40px;border-radius:20px;background:var(--blue-fill);color:var(--blue-ink);display:grid;place-items:center}.pr-src i svg{width:19px;height:19px}
.pr-vl{margin:6px 0 22px}
.pr-vr{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:15.5px}
.pr-vr:last-child{border:0}
.pr-vr i{width:36px;height:36px;border-radius:18px;background:var(--blue-fill);color:var(--blue-ink);display:grid;place-items:center;flex:none}
.pr-vr i svg{width:18px;height:18px}
.pr-sico{width:56px;height:56px;border-radius:28px;background:var(--green-fill);color:var(--green);display:grid;place-items:center;margin:6px 0 14px}
.pr-sico svg{width:26px;height:26px;stroke-width:2.2}
.bs .au-btn{margin-top:4px}
.pr-hold{position:relative;height:852px;overflow:hidden}
/* Plotësoni profilin page (22.11.2026): one page, photo and biography both optional; Më vonë counts as a decision */
.pp-top{display:flex;align-items:center;gap:10px;height:44px;margin-top:6px;font-size:17px;font-weight:500}
.pp-top .back{width:44px;height:44px;border-radius:22px;background:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(40,80,160,.08)}
.pv{display:flex;flex-direction:column;align-items:center;text-align:center;margin-top:26px}
.pv b{font-size:20px;font-weight:600;margin-top:10px}
.pv>span{font-size:14.5px;color:var(--muted);margin-top:2px}
.avw{position:relative;width:104px;height:104px}
.avw .bigav{width:104px;height:104px;border-radius:52px;display:grid;place-items:center;font-size:34px;font-weight:600;position:relative;overflow:hidden}
.avw .bigav.ini{background:linear-gradient(135deg,#6AA0FF,#3F7BEF);color:#fff;box-shadow:0 12px 28px rgba(80,140,250,.35)}
.avw .bigav.ph{background:#F3F6FB;border:1.2px solid #AFC0D8}
.avw .bigav svg.x{position:absolute;inset:0;width:100%;height:100%;stroke:#AFC0D8;stroke-width:1}
.avw .badge{position:absolute;right:-2px;bottom:2px;width:36px;height:36px;border-radius:18px;background:#fff;color:var(--blue-ink);display:grid;place-items:center;box-shadow:0 6px 16px rgba(40,80,160,.18)}
.avw .badge svg{width:18px;height:18px}
.ac2{background:#fff;border-radius:24px;padding:18px 16px;box-shadow:0 10px 30px rgba(40,80,160,.08);margin-top:26px}
.ac2 h3{margin:0;font-size:17px;font-weight:600}
.pta{margin-top:12px;min-height:120px;border-radius:16px;background:var(--track);padding:12px 14px 28px;font-size:15.5px;line-height:1.4;color:#8A97B3;position:relative}
.pta.v{color:var(--ink)}
.pta small{position:absolute;right:12px;bottom:8px;font-size:12px;color:var(--muted)}
.pcar{display:inline-block;width:1.6px;height:18px;background:var(--blue);vertical-align:-3px;margin-left:1px}
.avw .upr{position:absolute;inset:-6px;width:116px;height:116px;z-index:2}
.pfail{font-size:14px;color:var(--red);margin-top:8px}
.pta.over{box-shadow:0 0 0 1.6px var(--red)}.pta.over small{color:var(--red);font-weight:600}
.perr{position:absolute;left:0;right:0;bottom:66px;text-align:center;font-size:12px;color:var(--red)}
.opt{display:flex;align-items:center;gap:14px;height:56px;font-size:17px;font-weight:600}
.opt i{width:42px;height:42px;border-radius:21px;background:var(--blue-fill);color:var(--blue-ink);display:grid;place-items:center}.opt i svg{width:19px;height:19px}
.opt.del{color:var(--pink)}.opt.del i{background:var(--pink-fill);color:var(--pink)}
.pb{height:52px;border-radius:26px;display:grid;place-items:center;font-size:17px;font-weight:600;margin-top:12px}
.pb.light{background:var(--blue-fill);color:var(--blue-ink)}.pb.pinko{border:1.5px solid #EDA8C9;color:var(--pink);background:#fff}
.bs .sub2{font-size:15px;color:var(--muted);margin:0 0 6px;line-height:1.4}
.duo2{position:absolute;left:20px;right:20px;bottom:34px;display:flex;gap:10px}.duo2 .au-btn{flex:1}.duo2 .au-btn.sec{flex:0 0 120px;background:#fff;color:var(--muted);box-shadow:0 8px 20px rgba(40,80,160,.06)}
</style>
</head>
<body>
<div id="f"></div>
<script src="kidocare.js"></script>
<script>
const c=h=>`<div class="crop au-c bg">${h}</div>`;
const ERR_REQ='Plotësoni fushat e detyrueshme për të vazhduar.';
Object.assign(P,{upload:'<path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 15v4h16v-4"/>',
 shield:'<path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/>',
 idc:'<rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="9" cy="12" r="2.4"/><path d="M14 10.5h4M14 13.5h3"/>',
 badge:'<rect x="4" y="3" width="16" height="18" rx="3"/><circle cx="12" cy="10" r="3"/><path d="M8 17h8"/>',
 img:'<rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/>',
 file:P.file||'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/>'});
/* ---------- fields ---------- */
function auConf(o={}){
  const v=o.v?`<span class="v" style="letter-spacing:2px">${'•'.repeat(o.v)}</span>`:`<span class="ph"></span>`;
  const help=o.help?`<div class="au-help err">${o.help}</div>`:'';
  return `<div class="au-f"><label>Konfirmoni fjalëkalimin</label><div class="au-in pw ${o.st||''}">${v}${o.st==='ok'?`<span class="ok">${I('check')}</span>`:''}${I('eye')}</div>${help}</div>`;
}
const LIC='Numri i licencës (Urdhri i Mjekut)';
const stepTop=n=>`<div class="au-top"><span class="back">${I('back')}</span><img class="lg" src="img/logo-kidocare.png" alt="KidoCare"><span class="pr-step"><b>${n}</b>/2</span></div>`;
/* ---------- step 1: Të dhënat ---------- */
function s1(o={}){
  return auPage(`${stepTop(1)}<h1>Të dhënat</h1>
  ${o.name||auField('Emri i plotë')}${o.lic||auField(LIC)}${o.spec||auField('Specialiteti')}${o.phone||auPhone()}${o.email||auField('Email')}${o.pass||auPass()}${o.conf||auConf()}
  ${auCta('Vazhdo',{link:['Kam llogari?','Hyr'],err:o.err}).replace('class="au-cta"','class="au-cta flow" style="margin-top:30px"')}`);
}
const S1={name:auField('Emri i plotë',{v:'Blerina Kola'}),lic:auField(LIC,{v:'1937'}),spec:auField('Specialiteti',{v:'Pediatri e përgjithshme'}),phone:auPhone({v:'68 220 4519',st:'ok'}),email:auField('Email',{v:'blerina.kola@gmail.com'}),pass:auPass({v:'pediatri2026',hst:'ok'}),conf:auConf({v:12,st:'ok'})};
const S1ERR={name:auField('Emri i plotë',{v:'Blerina Kola'}),lic:auField(LIC,{st:'err'}),spec:auField('Specialiteti',{st:'err'}),phone:auPhone({st:'err'}),email:auField('Email',{st:'err'}),pass:auPass({st:'err',hst:'err'}),conf:auConf({st:'err'}),err:ERR_REQ};
/* ---------- step 2: Dokumentet, cards like the Kartela test cards ---------- */
const DOC={lic:['Licenca','pdf','licenca-urdhri.pdf'],id:['Karta e identitetit','img','karta-id.jpg'],ins:['Sigurimi profesional','pdf','sigurimi-2026.pdf']};
function doc(k,st=''){
  const [n,t,f]=DOC[k];const has=st==='ok'||st==='ver';
  const pv=has?`<div class="file">${X()}<b>${t==='pdf'?'PDF':'Foto'}</b></div>`:st==='fail'?`<span class="ub f">${I('file')}</span>`:`<span class="ub">${I('upload')}</span>`;
  const sub={ok:`<span>${f}</span>`,ver:`<span class="g">${I('check')}Verifikuar</span>`,busy:`<div class="bar2"><i></i></div>`,rej:`<span class="r">Sigurimi ka skaduar</span>`,fail:`<span class="r">Ngarkimi dështoi</span>`,big:`<span class="r">Skedari kalon 10 MB</span>`}[st]||'';
  const act=st==='ok'?`<span class="la m">${I('refresh')}Zëvendëso</span>`:st==='ver'||st==='busy'?'':`<span class="la ${st==='miss'?'red':''}">Ngarko</span>`;
  return `<div class="pr-ld ${has?'':'e'}">${pv}<div class="lt"><b>${n}</b>${sub}</div>${act}</div>`;
}
function s2(st=['','',''],o={}){
  return auPage(`${o.re?auTop():stepTop(2)}<h1>${o.re?'Apliko përsëri':'Dokumentet'}</h1>
  <div class="pr-ldl">${doc('lic',st[0])}${doc('id',st[1])}${doc('ins',st[2])}</div>
  ${o.terms||auTerms(o.re?'on':'')}${auCta(o.busy?'':'Dërgo aplikimin',{err:o.err,busy:o.busy})}`);
}
const S2FULL=()=>s2(['ok','ok','ok'],{terms:auTerms('on')});
/* tap a document: the Kartela file overlay, with Zëvendëso */
function docView(k,pages){
  const [n,t,f]=DOC[k];
  return `<div class="ov bg"><div class="under">${S2FULL()}</div><div class="glass"></div><div style="position:absolute;top:0;left:0;right:0">${statusBar()}</div>
  <div class="ovtop">${pages?`<span class="pill">1 / ${pages}</span>`:'<span></span>'}<span class="xbtn">${I('x')}</span></div>
  <div class="sheetfile">${X()}</div>
  <div class="ovcard"><div class="tx"><b>${n}</b><span>${f}</span></div>${pages?`<div class="dots" style="margin-right:14px"><i class="on"></i>${'<i></i>'.repeat(pages-1)}</div>`:''}<span class="rp">${I('refresh')}Zëvendëso</span></div></div>`;
}
const srcSheet=()=>`<div class="pr-hold">${s2(['ok','',''])}${bsheet(`<div class="stitle">Karta e identitetit</div><div class="pr-src"><div><i>${I('cam')}</i>Bëni foto</div><div><i>${I('img')}</i>Zgjidhni nga galeria</div><div><i>${I('file')}</i>Zgjidhni skedar</div></div>`)}</div>`;
const leaveSheet=()=>`<div class="pr-hold">${s2(['ok','ok',''])}${bsheet(`<div class="stitle">Të dilni nga regjistrimi?</div><div class="ssub">Të dhënat dhe dokumentet nuk ruhen.</div><div class="btnb red">Dil</div><div class="btnb ghost">Vazhdo regjistrimin</div>`,false)}</div>`;
/* after sending: the account exists; this explains the verification once, then Turni opens locked */
const sent=()=>`<div class="pr-hold">${S2FULL()}${bsheet(`<div class="pr-sico">${I('check')}</div><div class="stitle">Aplikimi u dërgua</div>
  <div class="ssub">Para se llogaria të aktivizohet, kontaktojmë institucionet për të verifikuar:</div>
  <div class="pr-vl"><div class="pr-vr"><i>${I('badge')}</i>Licencën te Urdhri i Mjekut</div><div class="pr-vr"><i>${I('idc')}</i>Kartën e identitetit</div><div class="pr-vr"><i>${I('shield')}</i>Sigurimin profesional</div></div>
  <div class="ssub">Do t'ju njoftojmë sapo llogaria të jetë aktive.</div><div class="au-btn">Në rregull</div>`,false)}</div>`;

P.cam=P.cam||'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>';
P.pen=P.pen||'<path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/>';
const PBIO='Pediatre me 9 vjet përvojë në Spitalin Universitar “Nënë Tereza”.';
P.img=P.img||'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>';
P.trash=P.trash||'<path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>';
const PLONG='Pediatre me 9 vjet përvojë në Spitalin Universitar “Nënë Tereza” në Tiranë. Punoj me të porsalindur dhe fëmijë deri në 14 vjeç, me fokus te alergjitë, astma dhe ushqyerja në vitet e para. Flas shqip, anglisht dhe italisht dhe u përgjigjem prindërve me durim e qartësi në çdo orë të turnit, edhe në fundjavë.';
/* o: ph photo, v bio text, up uploading, fail upload failed, busy saving, err save failed */
function ppage(ph,v,o={}){
  const over=v&&v.length>300, touched=ph||v;
  const ring=o.up?`<svg class="upr" viewBox="0 0 116 116"><circle cx="58" cy="58" r="55" fill="none" stroke="#E3EBF8" stroke-width="4"/><circle cx="58" cy="58" r="55" fill="none" stroke="#5B96FF" stroke-width="4" stroke-linecap="round" stroke-dasharray="210 346" transform="rotate(-90 58 58)"/></svg>`:'';
  const av=(ph&&!o.up)||o.up?`<div class="bigav ph">${X('x')}</div>`:`<div class="bigav ini" style="${avBg('Dr. Blerina Kola')}">${avIni('Dr. Blerina Kola')}</div>`;
  const badge=o.up?'':`<span class="badge">${I(ph?'pen':'cam')}</span>`;
  const fail=o.fail?`<div class="pfail">Fotoja nuk u ngarkua. Provoni përsëri.</div>`:'';
  const btn=o.busy?`<div class="au-btn busy"><span class="au-spin"></span>Duke ruajtur</div>`:`<div class="au-btn">Përfundo</div>`;
  return auPage(`<div class="pp-top"><span class="back">${I('back')}</span>Turni</div><h1>Plotësoni profilin</h1>
   <div class="pv"><div class="avw">${ring}${av}${badge}</div><b>Dr. Blerina Kola</b><span>Pediatre, Spitali Universitar “Nënë Tereza”</span>${fail}</div>
   <div class="ac2"><h3>Biografia</h3><div class="pta ${v?'v':''} ${over?'over':''}">${v?v+(o.nocar?'':'<span class="pcar"></span>'):'Përvoja juaj, me pak fjalë'}<small>${v?v.length:0}/300</small></div></div>
   <div class="duo2">${o.err?`<div class="perr">Profili nuk u ruajt. Provoni përsëri.</div>`:''}${touched?'':`<div class="au-btn sec">Më vonë</div>`}${btn}</div>`);
}
const ppSheet=(under,inner)=>`<div class="ov bg"><div class="under">${under}</div><div class="glass"></div><div style="position:absolute;top:0;left:0;right:0">${statusBar()}</div><div class="bs"><div class="grab"></div><span class="xbtn">${I('x')}</span>${inner}</div></div>`;
const F={
 'pp-min':()=>ppage(0,''),
 'pp-full':()=>ppage(1,PBIO),
 'pp-sheet':()=>ppSheet(ppage(0,''),`<h3>Fotoja e profilit</h3><div style="height:12px"></div><div class="opt"><i>${I('cam')}</i>Bëni një foto</div><div class="opt"><i>${I('img')}</i>Zgjidhni nga galeria</div>`),
 'pp-sheet2':()=>ppSheet(ppage(1,PBIO,{nocar:1}),`<h3>Fotoja e profilit</h3><div style="height:12px"></div><div class="opt"><i>${I('cam')}</i>Bëni një foto</div><div class="opt"><i>${I('img')}</i>Zgjidhni nga galeria</div><div class="opt del"><i>${I('trash')}</i>Hiqni foton</div>`),
 'pp-up':()=>ppage(0,'',{up:1}),
 'pp-fail':()=>ppage(0,'',{fail:1}),
 'pp-photo':()=>ppage(1,''),
 'pp-over':()=>ppage(0,PLONG),
 'pp-busy':()=>ppage(1,PBIO,{busy:1,nocar:1}),
 'pp-err':()=>ppage(1,PBIO,{err:1,nocar:1}),
 'pp-leave':()=>ppSheet(ppage(1,PBIO,{nocar:1}),`<h3>Të dilni pa ruajtur?</h3><p class="sub2">Fotoja dhe biografia nuk janë ruajtur ende.</p><div class="pb light">Vazhdoni plotësimin</div><div class="pb pinko">Dilni pa ruajtur</div>`),
 'path-1':()=>s1(), 'path-2':()=>s1(S1), 'path-3':()=>S2FULL(), 'path-4':()=>sent(),
 'screen-min':()=>s1(), 'screen-full':()=>S2FULL(),
 /* step 1 */
 's1-empty':()=>s1(), 's1-full':()=>s1(S1), 's1-err':()=>s1(S1ERR),
 's1-mis':()=>s1({...S1,conf:auConf({v:9,st:'err',help:'Fjalëkalimet nuk përputhen.'})}),
 's1-taken':()=>s1({...S1,phone:auPhone({v:'68 220 4519',st:'err',help:['Ky numër ka tashmë një llogari.','err']})}),
 's1-lic':()=>s1({...S1,lic:auField(LIC,{v:'1937',st:'err',help:['Kjo licencë ka tashmë një llogari.','err']})}),
 'spec-empty':()=>c(auField('Specialiteti')), 'spec-full':()=>c(auField('Specialiteti',{v:'Pediatri e përgjithshme'})),
 /* step 2 */
 's2-empty':()=>s2(), 's2-mix':()=>s2(['ok','busy','']), 's2-full':()=>S2FULL(),
 's2-err':()=>s2(['ok','miss','miss'],{terms:auTerms('err'),err:ERR_REQ}),
 's2-busy':()=>s2(['ok','ok','ok'],{terms:auTerms('on'),busy:'Duke dërguar'}),
 'd-empty':()=>c(doc('lic')), 'd-busy':()=>c(doc('id','busy')), 'd-pdf':()=>c(doc('lic','ok')), 'd-img':()=>c(doc('id','ok')),
 'd-fail':()=>c(doc('id','fail')), 'd-big':()=>c(doc('ins','big')), 'd-miss':()=>c(doc('ins','miss')),
 'd-src':()=>srcSheet(), 'd-view':()=>docView('lic',2), 'd-view1':()=>docView('id',0),
 /* leaving, sending, reapplying */
 'leave':()=>leaveSheet(), 'sent':()=>sent(),
 're':()=>s2(['ver','ver','rej'],{re:1}), 'd-ver':()=>c(doc('lic','ver')), 'd-rej':()=>c(doc('ins','rej')),
};
window.FRAME_IDS=Object.keys(F);
function show(){
  const id=location.hash.slice(1)||'path-1';
  document.getElementById('f').innerHTML=(F[id]||F['path-1'])();
  const post=()=>{try{parent.postMessage({liveFrame:id,h:document.getElementById('f').scrollHeight},'*')}catch(e){}};
  requestAnimationFrame(post);document.querySelectorAll('#f img').forEach(i=>i.complete||i.addEventListener('load',post));
}
addEventListener('hashchange',show);show();
document.fonts&&document.fonts.ready.then(show);
</script>
</body>
</html>
