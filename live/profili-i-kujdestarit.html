<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=393">
<title>Profili i kujdestarit frames</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kidocare.css">
<style>
.gid{display:flex;align-items:center;gap:16px;margin:12px 0 22px;padding-right:56px}
.gid i{width:60px;height:60px;border-radius:30px;background:var(--blue-fill);color:var(--blue-ink);display:grid;place-items:center;flex:none}
.gid i svg{width:28px;height:28px}
.gid b{display:block;font-size:22px;font-weight:600;line-height:1.25}
.gid span{display:flex;align-items:center;gap:8px;font-size:17px;color:var(--muted);margin-top:3px}
.gid .chip{height:24px;font-size:15px;padding:0 10px;color:var(--blue-ink)}
.kl{font-size:15px;color:var(--muted);display:flex;align-items:center;gap:8px;margin-bottom:10px}
.kl .cnt2{min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:var(--blue-fill);color:var(--blue-ink);font-size:15px;font-weight:600;display:grid;place-items:center}
.kids{background:var(--tile);border-radius:22px;padding:0 14px}
.kid{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid #DFE7F4}
.kid:first-child{border-top:0}
.kid .ka{width:44px;height:44px;flex:none;position:relative;align-self:flex-start;margin-top:2px}
.kid .ka img{position:absolute;left:0;bottom:0;width:44px}
.kid .tx{flex:1;min-width:0}
.kid .tx b{display:block;font-size:17px;font-weight:600;line-height:1.3}
.kid .tx span{display:block;font-size:15px;color:var(--muted)}
.kid .tx em{display:block;font-style:normal;font-size:14px;font-weight:600;color:var(--muted);margin-top:4px}
.failrow2{display:flex;align-items:center;gap:10px;background:#fff;border-radius:22px;padding:12px 14px;box-shadow:0 10px 30px rgba(40,80,160,.08);font-size:15px;color:var(--muted);white-space:nowrap}
.failrow2 i{width:42px;height:42px;border-radius:21px;background:var(--amber-fill);color:var(--amber);display:grid;place-items:center;flex:none}
.failrow2 i svg{width:20px;height:20px}
.failrow2 span{flex:1}
.failrow2 b{color:var(--blue-ink);font-weight:600}
</style>
</head>
<body>
<div id="f"></div>
<script src="kidocare.js"></script>
<script>
const KIDS_V=[['img/bunny.png','Anisa Marjeta Xhaferraj-Gjonbalaj','8 vjeç &amp; 3 muaj',1],['img/panda.png','Ela Xhaferraj','4 vjeç &amp; 1 muaj'],['img/monkey2.png','Ben Xhaferraj','1 vjeç &amp; 2 muaj']];
function sheet(c,g,kids,o={}){
  const list=o.fail?`<div class="failrow2"><i>${I('alert')}</i><span>Fëmijët nuk u ngarkuan</span><b>Provoni përsëri</b></div>`
   :`<div class="kids">${kids.map(([a,n,ag,cur])=>`<div class="kid"><span class="ka"><img src="${a}" alt=""></span><div class="tx"><b>${n}</b><span>${ag}</span>${cur?'<em>Profili aktual</em>':''}</div>${cur?'':I('chev','chev')}</div>`).join('')}</div>`;
  return `<div class="ov bg"><div class="under">${profile(c)}</div><div class="glass"></div><div style="position:absolute;top:0;left:0;right:0">${statusBar()}</div>
   <div class="bs"><div class="grab"></div><span class="xbtn">${I('x')}</span>
   <div class="gid"><i>${I('user')}</i><div><b>${g[0]}</b><span>${g[1]}${g[2]?'<span class="chip c-blue">Kryesore</span>':''}</span></div></div>
   <div class="kl">Fëmijët në Kidocare${o.fail?'':`<span class="cnt2">${kids.length}</span>`}</div>${list}</div></div>`;
}
const F={
 'gp-min':()=>sheet(NOA,['Klea Leka','Nëna',1],[['img/monkey.png','Noa Leka','2 vjeç &amp; 7 muaj',1]]),
 'gp-full':()=>sheet(ANISA,['Valbona Xhaferraj','Nëna',1],KIDS_V),
 'gp-other':()=>sheet(ANISA,['Gentian Gjonbalaj','Babai'],KIDS_V.slice(0,1)),
 'gp-long':()=>sheet(ANISA,['Valbona Marjeta Xhaferraj-Gjonbalaj','Nëna',1],KIDS_V),
 'gp-fail':()=>sheet(ANISA,['Valbona Xhaferraj','Nëna',1],[],{fail:1})
};
window.FRAME_IDS=Object.keys(F);
function show(){
  const id=location.hash.slice(1)||'gp-min';
  document.getElementById('f').innerHTML=(F[id]||F['gp-min'])();
  requestAnimationFrame(()=>{try{parent.postMessage({liveFrame:id,h:document.getElementById('f').scrollHeight},'*')}catch(e){}});
}
addEventListener('hashchange',show);show();
document.fonts&&document.fonts.ready.then(show);
</script>
</body>
</html>
