.ph-top{display:flex;align-items:center;justify-content:space-between;margin:8px 0 12px}

.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding-bottom:4px}

.bioh{font-size:20px;font-weight:600;margin:22px 4px 12px}

.bioadd span{font-size:14px;color:var(--muted)}
.more{color:var(--blue-ink);font-weight:600;font-size:15px;margin-top:6px}

.inp2{border:1.5px solid var(--field-line);border-radius:18px;background:#F7FAFE;padding:12px 14px;font-size:16px;line-height:1.45;min-height:48px}

.ferr{display:flex;align-items:center;gap:6px;color:var(--err);font-size:14px;margin-top:6px}

.lchips span.add{background:#fff;border:1.5px solid var(--field-line)}
.locked{margin-top:22px}

.edock .b{height:55px;border-radius:28px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:17px;font-weight:600}
.edock .b.off{background:#EEF2F9;color:#9AA4BA}
.edock .b.on{background:var(--blue);color:#fff;box-shadow:0 12px 26px rgba(80,140,250,.30)}
.edock .b.go{background:#76A6FF;color:#fff}
.edock .fail{display:flex;align-items:center;gap:10px;height:44px;border-radius:22px;background:var(--amber-fill);color:var(--amber);padding:0 16px;font-size:15px;margin-bottom:10px}
.edock .fail svg{width:18px;height:18px}
.edock .fail b{margin-left:auto;font-weight:600}
.spin{width:20px;height:20px;border-radius:10px;border:2.5px solid rgba(255,255,255,.45);border-top-color:#fff}

.bs h3{font-size:21px;font-weight:600;margin:16px 0 4px}
.bs p.sub2{font-size:15px;color:var(--muted);margin-bottom:18px}
.opt{display:flex;align-items:center;gap:14px;height:56px;font-size:17px;font-weight:600}

.shnote svg{width:15px;height:15px}
.pb{height:52px;border-radius:26px;display:grid;place-items:center;font-size:17px;font-weight:600;margin-top:12px}
.pb.light{background:var(--blue-fill);color:var(--blue-ink)}
.pb.pinko{border:1.5px solid #EDA8C9;color:var(--pink);background:#fff}
.peer{text-align:center}
.peer .dav{width:76px;height:76px;border-radius:38px;margin:4px auto 12px}
.peer h3{display:flex;justify-content:center;align-items:center;gap:8px;font-size:23px;margin:0;line-height:1.3;flex-wrap:wrap;padding:0 30px}
.peer p.bio2{font-size:15px;color:#3C4A68;line-height:1.5;margin:10px 0 16px}
.peer p.bio2.cut{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:4px}
.peer .about{box-shadow:none;background:var(--tile);text-align:left}
.peer .ar{border-color:#E2E9F4}
</style>

  bio:"Pediatre me 12 vite përvojë, me fokus te astma dhe alergjitë tek fëmijët. Më pëlqen t'u shpjegoj prindërve çdo hap të trajtimit me fjalë të thjeshta.",licSoon:1};
const REVIEWS=[[5,'22.10','Shumë e kujdesshme me Anisën. Na shpjegoi qartë si ta përdorim inhalatorin dhe pas dy ditësh na shkroi vetë për të pyetur si ishte. Ndihesh i qetë kur e di që dikush e ndjek fëmijën nga afër, edhe pas konsultës. E rekomandoj pa mëdyshje.','Valbona X.'],
 [5,'18.10','','Elira M.'],[4,'09.10','U lidhëm shpejt dhe mori kohë të dëgjonte. Thirrja u ndërpre një herë.','Dritan P.'],[1,'2025','Prita gjatë për përgjigje.','Artan B.']];

/* ---------- Zyra ---------- */
function zcard(d,o={}){
  const av=d.photo?`<span class="dav ph">${X('x')}</span>`:`<span class="dav">${I('user')}</span>`;
  const st=o.pend?`<span class="pend">${I('clock')}Në verifikim</span>`:`<span class="st"><span class="dot ${o.off?'off':''}"></span>${o.off?'Jo aktive':'Aktive'}${d.reviews>=3?`<span class="rate"><svg viewBox="0 0 24 24">${P.star}</svg>${d.avg}</span>`:''}</span>`;
  return `<div class="zc">${av}<div class="tx"><b>${d.name}${o.pend?'':BADGE}</b>${st}</div><span class="cb">${I('chev')}</span></div>`;
}
const mi=(ic,t,right)=>`<div class="mi"><i>${I(ic)}</i><b>${t}</b>${right||`<span class="cb">${I('chev')}</span>`}</div>`;
const licChip=s=>s==='soon'?`<span class="chip c-amber">Skadon</span>`:s==='gone'?`<span class="chip c-pink">Ka skaduar</span>`:'';
const navbar=()=>`<div class="nav">${[['steth','Turni'],['msg','Konsultat',3],['info','Infopoint'],['chat','Forumi'],['file','Zyra',0,1]].map(([i,l,b,on])=>`<span class="${on?'on':''}"><i>${I(i)}</i>${l}${b?`<em class="nb">${b}</em>`:''}</span>`).join('')}</div>`;
function zyra(d,o={}){
  return `<div class="page bg" style="padding-bottom:120px">${statusBar()}<div class="zh"><h1>Zyra</h1><span class="bell">${I('bell')}</span></div>${zcard(d)}
   <div class="zs">Puna</div><div class="menu">${mi('cal','Orari')}${mi('coin','Fitimet')}${mi('award','Licenca',(o.lic?licChip(o.lic)+' ':'')+`<span class="cb">${I('chev')}</span>`)}</div>
   <div class="zs">Llogaria</div><div class="menu">${mi('shield','Siguria')}${mi('globe','Gjuha','<span class="lang"><span class="on">AL</span><span>EN</span></span>')}</div>
   <div class="menu" style="margin-top:16px">${mi('heart','Kalo te prindi')}${mi('logout','Dil','')}</div>
   <p class="znote">Miratimi, auditimi dhe protokollet menaxhohen nga Drejtuesi Klinik jashtë aplikacionit.</p>${navbar()}</div>`;
}

/* ---------- profile ---------- */
function hero(d,o={}){
  const ph=d.photo&&!o.fail;
  const ring=o.up?`<svg class="ring" viewBox="0 0 132 132"><circle cx="66" cy="66" r="62" fill="none" stroke="#E3EBF8" stroke-width="5"/><circle cx="66" cy="66" r="62" fill="none" stroke="#5B96FF" stroke-width="5" stroke-linecap="round" stroke-dasharray="234 390" transform="rotate(-90 66 66)"/></svg>`:'';
  const name=o.long?'Dr. Anastasia Kristofori-Papadhimitri':d.name;
  const rl=o.pend?`<span class="pend">${I('clock')}Në verifikim</span>`:d.reviews>=3?`<div class="rl"><svg viewBox="0 0 24 24">${P.star}</svg>${d.avg} · ${d.reviews} vlerësime</div>`:d.reviews?`<div class="rl">${d.reviews} vlerësim${d.reviews>1?'e':''}</div>`:'';
  return `<div class="hero"><div class="big"><div class="in ${ph?'ph':''}">${ph?X('x'):I('user')}</div>${o.self===false||o.up?'':`<span class="cam">${I('cam')}</span>`}${ring}</div><h2>${name}${o.pend?'':BADGE}</h2>${rl}</div>`;
}
const ptabs=(d,on)=>`<div class="ptabs"><span class="${on===0?'on':''}">${I('user')}Profili</span><span class="${on===1?'on':''} ${d.reviews?'':'zero'}">${I('star')}Vlerësimet <b>${d.reviews}</b></span></div>`;
const ar=(ic,lab,val,sub,extra)=>`<div class="ar"><i>${I(ic)}</i><div><small>${lab}</small><b>${val}</b>${sub?`<span>${sub}</span>`:''}${extra||''}</div></div>`;
function licRow(d,s){
  return ar('award','Licenca','Nr. '+d.lic,'',s==='soon'?`<span class="chip c-amber">${I('tri')}Skadon më 15.12</span>`:s==='gone'?`<span class="chip c-pink">${I('tri')}Ka skaduar</span>`:'');
}
function about(d,o={}){
  const rows=[ar('steth','Specialiteti',d.spec,o.peer?'':'Ndryshohet nga drejtuesi klinik'),ar('building','Vendi i punës',d.work,d.city)];
  if(d.years) rows.push(ar('brief','Përvoja',d.years));
  if(d.langs) rows.push(ar('globe','Gjuhët','','',`<div class="chips">${d.langs.map(l=>`<span class="chip c-blue">${l}</span>`).join('')}</div>`).replace('<b></b>',''));
  rows.push(o.peer?ar('award','Licenca','Nr. '+d.lic):licRow(d,o.lic));
  return `<div class="about">${rows.join('')}</div>`;
}
const bioBlock=d=>`<div class="bioh">Bio</div>${d.bio?`<div class="bio">${d.bio}</div>`:`<div class="bioadd"><i>${I('plus')}</i><div><b>Shtoni disa fjalë për veten</b><span>Prindërit e lexojnë para se t'ju zgjedhin.</span></div></div>`}`;
const profTop=()=>`<div class="ph-top"><span class="l"><span class="back">${I('back')}</span>Zyra</span><span class="edit">${I('pen')}Ndrysho</span></div>`;
function prof(d,o={}){
  const body=o.tab===1?reviewsTab(d):about(d,{lic:d.licSoon?'soon':''})+bioBlock(d);
  return `<div class="page bg ${o.toast?'':''}" style="${o.toast?'height:852px;overflow:hidden':''}">${statusBar()}${profTop()}${hero(d)}${ptabs(d,o.tab||0)}${body}${o.toast?toast('Ndryshimet u ruajtën'):''}</div>`;
}
function rv(r,o={}){
  return `<div class="rv"><div class="h">${stars(r[0])}<span>${r[1]}</span></div>${r[2]?`<p class="${o.cut?'cut':''}">${r[2]}</p>${o.cut?'<div class="more">Më shumë</div>':o.open?'<div class="more">Më pak</div>':''}`:'<p class="only">Vetëm vlerësim, pa koment</p>'}<small>${r[3]}</small></div>`;
}
const summary=()=>`<div class="sum"><div class="avg"><b>4.8</b>${stars(5)}<span>32 vlerësime</span></div><div class="dist">${[[5,'88%'],[4,'12%'],[3,'0%'],[2,'0%'],[1,'3%']].map(([n,w])=>`<div>${n}<i style="--w:${w}"></i></div>`).join('')}</div></div>`;
const countCard=n=>`<div class="cnt-card"><i>${I('star')}</i><div><b>${n} vlerësim${n>1?'e':''}</b><span>Mesatarja shfaqet pas 3 vlerësimeve.</span></div></div>`;
const emptyRev=()=>`<div class="emptyr"><i>${I('star')}</i><b>Ende pa vlerësime</b><span>Pas çdo konsulte, prindi mund t'ju vlerësojë.<br>Vlerësimet shfaqen këtu.</span></div>`;
function reviewsTab(d){
  if(!d.reviews) return emptyRev();
  return `${summary()}<div class="bioh">Komentet</div>${rv(REVIEWS[0],{cut:1})}${REVIEWS.slice(1).map(r=>rv(r)).join('')}<div class="morebtn">Shfaq 28 të tjera</div>`;
}

/* ---------- edit ---------- */
function editPage(d,o={}){
  const bio=o.bioOver?BLERINA.bio+' Punoj edhe me fëmijë me dermatit atopik dhe alergji ushqimore, dhe ndjek nga afër rritjen dhe ushqyerjen e fëmijëve nga lindja deri në 5 vjeç, bashkë me prindërit.':d.bio;
  const photoTx=o.up?`<b>Fotoja e profilit</b><span class="m">Duke ngarkuar, 60%</span>`:o.photoFail?`<b>Fotoja e profilit</b><span class="warnl">${I('tri')}Fotoja nuk u ngarkua</span><span>Provoni përsëri</span>`:`<b>Fotoja e profilit</b><span>${d.photo?'Ndryshoni foton':'Shtoni foto'}</span>`;
  const av=o.up?`<span class="dav ph" style="position:relative">${X('x')}<svg viewBox="0 0 80 80" style="position:absolute;inset:0;width:100%;height:100%"><circle cx="40" cy="40" r="36" fill="none" stroke="#5B96FF" stroke-width="4" stroke-linecap="round" stroke-dasharray="140 240" transform="rotate(-90 40 40)"/></svg></span>`
    :d.photo?`<span class="dav ph" style="position:relative">${X('x')}</span>`:`<span class="dav">${I('user')}</span>`;
  const btn=o.saving?`<div class="b go"><span class="spin"></span>Duke ruajtur</div>`:`<div class="b ${o.dirty?'on':'off'}">Ruaj ndryshimet</div>`;
  return `<div class="page bg ep" style="height:852px;overflow:hidden">${statusBar()}<div class="hd"><span class="back">${I('back')}</span><h1>Ndrysho profilin</h1></div>
   <div class="ecard"><div class="prow">${av}<div>${photoTx}</div></div></div>
   <div class="ecard" style="margin-top:12px">
    <div class="fl2"><label>Bio<em class="${o.bioOver?'over':''}">${bio?(o.bioOver?313:149):0}/300</em></label><div class="inp2 tall ${bio?'':'ph'} ${o.bioOver?'err':''}">${bio||'P.sh. fusha ku keni më shumë përvojë'}</div>${o.bioOver?`<div class="ferr">${I('tri')}Shkurtojeni bion në 300 shenja.</div>`:''}</div>
    <div class="fl2"><label>Gjuhët</label><div class="lchips">${(d.langs||[]).map(l=>`<span>${l}${I('x')}</span>`).join('')}<span class="add">${I('plus')}Shtoni gjuhë</span></div></div>
    <div class="fl2"><label>Vendi i punës</label><div class="inp2 ${o.workErr?'err':''}">${o.workErr?'':d.work}</div>${o.workErr?`<div class="ferr">${I('tri')}Shkruani vendin ku punoni.</div>`:''}</div>
    <div class="fl2"><label>Qyteti</label><div class="inp2 ${o.dirty&&!o.workErr?'focus':''}">${d.city}</div></div>
    <div class="fl2"><label>Vite përvojë</label><div class="inp2 ${d.years?'':'ph'}">${d.years?d.years.replace(' vite',''):'P.sh. 5'}</div></div>
   </div>
   <div class="edock">${o.fail?`<div class="fail">${I('tri')}Ndryshimet nuk u ruajtën<b>Provoni përsëri</b></div>`:''}${btn}</div></div>`;
}
const valCrop=(lab,val,err,count)=>crop(`<div class="ecard"><div class="fl2"><label>${lab}${count?`<em class="over">${count}</em>`:''}</label><div class="inp2 err ${count?'tall':''}">${val}</div><div class="ferr">${I('tri')}${err}</div></div></div>`);

/* ---------- sheets ---------- */
function sheetOn(under,inner){return `<div class="ov bg"><div class="under">${under}</div><div class="glass"></div><div style="position:absolute;top:0;left:0;right:0">${statusBar()}</div><div class="bs"><div class="grab"></div><span class="xbtn">${I('x')}</span>${inner}</div></div>`}
const photoSheet=(d,has)=>sheetOn(prof(d),`<h3>Fotoja e profilit</h3><div style="height:12px"></div><div class="opt"><i>${I('cam')}</i>Bëni një foto</div><div class="opt"><i>${I('img')}</i>Zgjidhni nga galeria</div>${has?`<div class="opt del"><i>${I('trash')}</i>Hiqni foton</div>`:''}<div class="shnote">${I('info')}Prindërit e shohin këtë foto para konsultës.</div>`);
const PEERS={
 erion:{name:'Dr. Erion Dervishi',spec:'Pediatër',work:'Spitali Rajonal Vlorë',city:'Vlorë',years:'18 vite',langs:['Shqip','Anglisht'],lic:'1288',bio:'Pediatër në Vlorë që nga 2008. Ndjek fëmijë me sëmundje kronike të frymëmarrjes.'},
 long:{name:'Dr. Anastasia Kristofori-Papadhimitri',spec:'Gastroenterologe pediatrike',work:'Qendra Spitalore Universitare "Nënë Tereza"',city:'Tiranë',years:'21 vite',langs:['Shqip','Anglisht','Greqisht','Italisht'],lic:'0874'}
};
function peer(p,o={}){
  if(o.gone) return sheetOn(consultPage({...RES_OTHER}),`<div class="peer"><span class="dav" style="background:var(--grey-fill);color:var(--soft)">${I('user')}</span><h3 style="font-size:20px">Ky profil nuk është më i disponueshëm</h3><p class="bio2" style="color:var(--muted)">Mjeku nuk është më në Kidocare. Konsultat që ka bërë mbeten në kartelë.</p></div>`);
  const bio=p.bio?`<p class="bio2 ${o.cut?'cut':''}">${o.cut?p.bio+" Më parë kam punuar në Athinë. Më intereson veçanërisht edukimi i prindërve për përdorimin e inhalatorëve dhe parandalimin e krizave.":p.bio}</p>${o.cut?'<div class="more" style="margin-bottom:16px">Më shumë</div>':''}`:'<div style="height:14px"></div>';
  return sheetOn(consultPage({...RES_OTHER}),`<div class="peer"><span class="dav">${I('user')}</span><h3>${p.name}${BADGE}</h3>${bio}${about(p,{peer:1})}</div>`);
}
const RES_OTHER={title:'Astmë bronkiale',chips:chipKron,who:'Valbona Xhaferraj, nëna',note:'Kollitet natën prej disa javësh dhe i merret fryma kur vrapon. Babai ka astmë.',assess:'Astmë bronkiale e lehtë persistente.',steps:['Pompa vetëm kur kollitet'],warn:['Buzët marrin ngjyrë blu'],date:'16.09.2021, 18:45',type:'Video, 15 min',doc:'Dr. Erion Dervishi',nr:'1408'};

/* ---------- frames ---------- */
const F={
 'path-1':()=>zyra(ARBEN),
 'path-2':()=>prof(ARBEN),
 'path-3':()=>editPage(ARBEN),
 'path-4':()=>photoSheet(ARBEN,0),
 'path-5':()=>prof(ARBEN,{tab:1}),
 'zyra-full':()=>zyra(BLERINA,{lic:'soon'}),
 'screen-full':()=>prof(BLERINA),
 'screen-full-v':()=>prof(BLERINA,{tab:1}),
 'z-card-min':()=>crop(zcard(ARBEN)),
 'z-card-full':()=>crop(zcard(BLERINA)),
 'z-card-off':()=>crop(zcard(BLERINA,{off:1})),
 'z-card-pend':()=>crop(zcard(ARBEN,{pend:1})),
 'z-lic':()=>crop(['','soon','gone'].map(s=>`<div class="menu" style="margin-bottom:10px">${mi('award','Licenca',licChip(s)+`<span class="cb">${I('chev')}</span>`)}</div>`).join('')),
 'id-min':()=>crop(hero(ARBEN)),
 'id-full':()=>crop(hero(BLERINA)),
 'id-long':()=>crop(hero(BLERINA,{long:1})),
 'id-fail':()=>crop(hero(BLERINA,{fail:1})),
 'photo-up-head':()=>crop(hero(BLERINA,{up:1})),
 'id-few':()=>crop(hero({...ARBEN,reviews:2})),
 'id-pend':()=>crop(hero(ARBEN,{pend:1})),
 'tabs-min':()=>crop(ptabs(ARBEN,0)),
 'tabs-col':()=>crop(ptabs(BLERINA,0)),
 'tabs-v':()=>crop(ptabs(BLERINA,1)),
 'about-min':()=>crop(about(ARBEN)+bioBlock(ARBEN)),
 'about-part':()=>crop(about({...ARBEN,langs:['Shqip','Anglisht']})+bioBlock(ARBEN)),
 'about-full':()=>crop(about(BLERINA)+bioBlock(BLERINA)),
 'lic-ok':()=>crop(`<div class="about">${licRow(BLERINA,'')}</div>`),
 'lic-soon':()=>crop(`<div class="about">${licRow(BLERINA,'soon')}</div>`),
 'lic-gone':()=>crop(`<div class="about">${licRow(BLERINA,'gone')}</div>`),
 'rev-min':()=>crop(emptyRev()),
 'rev-one':()=>crop(countCard(1)+rv(REVIEWS[2])),
 'rev-few':()=>crop(countCard(2)),
 'rev-sum':()=>crop(summary()),
 'rev-col':()=>crop(rv(REVIEWS[0],{cut:1})),
 'rev-exp':()=>crop(rv(REVIEWS[0],{open:1})),
 'rev-stars':()=>crop(rv(REVIEWS[1])),
 'rev-low':()=>crop(rv(REVIEWS[3])),
 'rev-more':()=>crop(rv(REVIEWS[3])+'<div class="morebtn">Shfaq 28 të tjera</div>'),
 'rev-fail':()=>crop(ptabs(BLERINA,1)+`<div class="rfail"><i>${I('tri')}</i><b>Vlerësimet nuk u ngarkuan</b><span>${I('refresh')}Provoni përsëri</span></div>`),
 'edit-full':()=>editPage(BLERINA),
 'edit-dirty':()=>editPage(BLERINA,{dirty:1}),
 'edit-saving':()=>editPage(BLERINA,{dirty:1,saving:1}),
 'saved':()=>prof(BLERINA,{toast:1}),
 'edit-err':()=>editPage(BLERINA,{dirty:1,fail:1}),
 'edit-discard':()=>sheetOn(editPage(BLERINA,{dirty:1}),`<h3>Të anulohen ndryshimet?</h3><p class="sub2">Ndryshimet që bëtë nuk janë ruajtur ende.</p><div class="pb light">Vazhdoni redaktimin</div><div class="pb pinko">Anuloni ndryshimet</div>`),
 'val-page':()=>editPage(BLERINA,{workErr:1}),
 'val-bio':()=>valCrop('Bio',BLERINA.bio+' Punoj edhe me fëmijë me dermatit atopik dhe alergji ushqimore, dhe ndjek nga afër rritjen dhe ushqyerjen e fëmijëve nga lindja deri në 5 vjeç, bashkë me prindërit.','Shkurtojeni bion në 300 shenja.','313/300'),
 'val-years':()=>valCrop('Vite përvojë','dymbëdhjetë','Shkruani vetëm numra, p.sh. 12.'),
 'val-work':()=>valCrop('Vendi i punës','','Shkruani vendin ku punoni.'),
 'photo-has':()=>photoSheet(BLERINA,1),
 'photo-remove':()=>sheetOn(prof(BLERINA),`<h3>Të hiqet fotoja?</h3><p class="sub2">Në vend të saj do të shfaqet ikona e profilit.</p><div class="pb pinko">Hiqni foton</div><div class="pb light">Anuloni</div>`),
 'photo-up':()=>editPage(BLERINA,{up:1}),
 'photo-fail':()=>crop(`<div class="ecard"><div class="prow"><span class="dav ph" style="position:relative">${X('x')}</span><div><b>Fotoja e profilit</b><span class="warnl">${I('tri')}Fotoja nuk u ngarkua</span><span>Provoni përsëri</span></div></div></div>`),
 'peer-other':()=>peer(PEERS.erion),
 'peer-min':()=>peer({name:'Dr. Arben Shehu',spec:'Mjek i përgjithshëm',work:'Qendra Shëndetësore Nr. 2',city:'Shkodër',lic:'2410'}),
 'peer-long':()=>peer(PEERS.long),
 'peer-bio':()=>peer(PEERS.erion,{cut:1}),
 'peer-gone':()=>peer(null,{gone:1})
};
window.FRAME_IDS=Object.keys(F);
function show(){
  const id=location.hash.slice(1)||'path-1';
  document.getElementById('f').innerHTML=(F[id]||F['path-1'])();
  requestAnimationFrame(()=>{try{parent.postMessage({liveFrame:id,h:document.getElementById('f').scrollHeight},'*')}catch(e){}});
}
addEventListener('hashchange',show);show();
document.fonts&&document.fonts.ready.then(show);
</script>
