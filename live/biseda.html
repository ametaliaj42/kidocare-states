<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=393">
<title>Biseda frames</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kidocare.css">
<style>
/* Biseda: the consultation chat on the doctor side */
.cs{height:852px;position:relative;display:flex;flex-direction:column;overflow:hidden}
/* header: back, who (tap opens Profili i fëmijës), urgent advice */
.bh{display:flex;align-items:flex-start;gap:12px;padding:8px 16px 12px}
.bh .back{margin-top:2px}
.bwho{flex:1;min-width:0}
.bwho b{display:block;font-size:20px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.bwho b svg{width:18px;height:18px;color:var(--soft);vertical-align:-3px;margin-left:2px}
.bwho .meta{display:block;font-size:14px;color:var(--muted);margin-top:1px}
.bh{align-items:center}
.bwho .pd{display:inline-block;width:10px;height:10px;border-radius:5px;background:#C3CBDA;margin-left:8px;vertical-align:2px}
.bwho .pd.on{background:#22C17A}
.bwho .pr{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--muted);margin-top:3px}
.bwho .pr i{width:9px;height:9px;border-radius:5px;background:#C3CBDA;flex:none}
.bwho .pr.on i{background:#22C17A}
.mbtn{width:44px;height:44px;border-radius:22px;background:#fff;color:var(--ink);display:grid;place-items:center;flex:none;margin-top:2px;box-shadow:0 10px 24px rgba(40,80,160,.10)}
.mbtn svg{width:20px;height:20px}
/* follow-up time under the result card */
.fu{align-self:flex-end;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-top:-4px;padding-right:4px}
.fu svg{width:14px;height:14px}
.opt .chev{margin-left:auto}
/* messages */
.thread{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;padding:0 16px 14px;min-height:0}
.day{align-self:center;height:28px;padding:0 13px;border-radius:14px;background:rgba(255,255,255,.7);font-size:13px;font-weight:500;color:var(--muted);display:grid;place-items:center;margin:4px 0}
.bb{max-width:290px;padding:10px 14px 7px;font-size:16px;line-height:1.4;border-radius:20px;position:relative}
.bb .tm{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-size:12px;margin-top:2px}
.bb .tm svg{width:15px;height:15px}
.bb.p{align-self:flex-start;background:#fff;border-bottom-left-radius:6px;box-shadow:0 6px 18px rgba(40,80,160,.06)}
.bb.p .tm{color:var(--muted)}
.bb.d{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:6px}
.bb.d .tm{color:rgba(255,255,255,.8)}
.bb.u{align-self:flex-end;background:var(--pink-fill);color:var(--ink);border-bottom-right-radius:6px}
.bb.u .lb2{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--pink);margin-bottom:3px}
.bb.u .lb2 svg{width:15px;height:15px}
.bb.u .tm{color:var(--muted)}
/* cards inside the thread: call, result, reschedule */
.ec{align-self:flex-end;width:286px;border-radius:20px;border-bottom-right-radius:6px;background:var(--blue);color:#fff;overflow:hidden}
.ec .top{display:flex;align-items:center;gap:12px;padding:12px 14px 6px 12px}
.ec .top i{width:46px;height:46px;border-radius:14px;background:#fff;color:var(--blue-ink);display:grid;place-items:center;flex:none}
.ec .top i svg{width:22px;height:22px}
.ec .top i.round{border-radius:23px}
.ec .top i.ok{background:var(--green-fill,#E2F5EA);color:#1A9E63}
.ec .top i.amb{background:var(--amber-fill);color:var(--amber)}
.ec .tx{flex:1;min-width:0}
.ec .tx b{display:block;font-size:17px;font-weight:600;line-height:1.3}
.ec .tx span{display:block;font-size:15px;color:rgba(255,255,255,.85);line-height:1.35}
.ec .tm{display:flex;justify-content:flex-end;font-size:12px;color:rgba(255,255,255,.8);padding:0 14px 8px}
.ec .act{display:flex;align-items:center;justify-content:center;gap:6px;height:46px;border-top:1px solid rgba(255,255,255,.22);font-size:16px;font-weight:600}
.ec .act svg{width:17px;height:17px}
/* reschedule: a white system card on the doctor's side */
.rs{align-self:flex-end;width:300px;background:#fff;border-radius:20px;border-bottom-right-radius:6px;box-shadow:0 10px 30px rgba(40,80,160,.08);overflow:hidden}
.rs .in{padding:14px 16px 10px}
.rs .h{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600}
.rs .h i{width:36px;height:36px;border-radius:18px;background:var(--blue-fill);color:var(--blue-ink);display:grid;place-items:center;flex:none}
.rs .h i svg{width:18px;height:18px}
.rs .tt{display:flex;align-items:center;gap:8px;margin:12px 0 0;font-size:15px}
.rs .tt s{color:var(--muted)}
.rs .tt svg{width:16px;height:16px;color:var(--soft)}
.rs .tt b{font-size:18px;font-weight:600}
.rs .q{font-size:14px;color:var(--muted);line-height:1.4;margin-top:8px}
.rs .ft{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.rs .ft .chip{height:26px;font-size:13px;border-radius:13px;padding:0 10px}
.rs .ft .chip svg{width:14px;height:14px}
.rs .ft small{font-size:12px;color:var(--muted)}
.rs .act{height:46px;border-top:1px solid var(--line);display:grid;place-items:center;font-size:16px;font-weight:600;color:var(--pink)}
/* bottom: result action and composer */
.bot{padding:0 16px 30px;display:flex;flex-direction:column;gap:10px}
.rbtn{height:54px;border-radius:27px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;gap:9px;font-size:17px;font-weight:600;box-shadow:0 12px 26px rgba(80,140,250,.30)}
.rbtn svg{width:20px;height:20px}
.cmp{display:flex;align-items:center;gap:10px}
.fld{flex:1;min-width:0;height:52px;border-radius:26px;background:#fff;display:flex;align-items:center;gap:10px;padding:0 16px 0 8px;box-shadow:0 10px 30px rgba(40,80,160,.06);font-size:16px;color:#8E9AB3}
.fld .pl{width:36px;height:36px;border-radius:18px;background:var(--blue-fill);color:var(--blue-ink);display:grid;place-items:center;flex:none}
.fld .pl svg{width:19px;height:19px}
.fld .val{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fld .caret{display:inline-block;width:2px;height:19px;background:var(--blue);vertical-align:-4px;margin-left:1px}
.snd{width:52px;height:52px;border-radius:26px;display:grid;place-items:center;flex:none;background:var(--grey-fill);color:#9098AD}
.snd svg{width:21px;height:21px}
.snd.on{background:var(--blue);color:#fff;box-shadow:0 10px 22px rgba(80,140,250,.30)}
/* attachment sheet */
.opt{display:flex;align-items:center;gap:14px;height:58px;font-size:17px;font-weight:500;border-bottom:1px solid var(--line)}
.opt:last-child{border-bottom:0}
.opt i{width:40px;height:40px;border-radius:20px;background:var(--blue-fill);color:var(--blue-ink);display:grid;place-items:center}
.opt i svg{width:19px;height:19px}
.cropc{padding:16px 16px 18px;display:flex;flex-direction:column;gap:10px}
/* ticks on blue: sent and delivered in white, seen in mint */
.bb.d .tm svg.seen{color:#A6F4CB}
.bb.u .tm svg.seen{color:var(--blue-ink)}
/* deleted message */
.bb.del{font-style:italic;opacity:.85}
.bb.del svg.i{width:15px;height:15px;vertical-align:-2px;margin-right:4px}
/* reply quote inside a bubble and above the field */
.qt{border-left:3px solid currentColor;border-radius:8px;padding:5px 9px;margin:0 0 6px;font-size:14px;line-height:1.35}
.bb.d .qt{background:rgba(255,255,255,.18);color:#fff}
.bb.p .qt{background:var(--tile);color:var(--blue-ink)}
.qt b{display:block;font-size:13px;font-weight:600}
.qt span{display:block;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbar{display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:9px 10px 9px 14px;box-shadow:0 10px 30px rgba(40,80,160,.06)}
.rbar .qt{flex:1;min-width:0;margin:0;background:var(--tile);color:var(--blue-ink)}
.rbar .x2{width:30px;height:30px;border-radius:15px;background:var(--track);display:grid;place-items:center;flex:none}
.rbar .x2 svg{width:15px;height:15px}
/* attachments in the thread */
.ph{align-self:flex-start;width:220px;background:#fff;border-radius:20px;border-bottom-left-radius:6px;padding:6px;box-shadow:0 6px 18px rgba(40,80,160,.06)}
.ph .im{height:160px;border-radius:15px;background:#F2F6FF;border:1px solid #AFC0D8;position:relative;overflow:hidden}
.ph .im svg.x{position:absolute;inset:0;width:100%;height:100%;stroke:#AFC0D8;stroke-width:.6}
.ph .tm{display:flex;justify-content:flex-end;font-size:12px;color:var(--muted);padding:5px 6px 1px}
.dc{align-self:flex-start;width:260px;background:#fff;border-radius:20px;border-bottom-left-radius:6px;padding:10px 12px 6px;box-shadow:0 6px 18px rgba(40,80,160,.06)}
.dc .r{display:flex;align-items:center;gap:11px;background:var(--tile);border-radius:14px;padding:10px}
.dc .r i{width:38px;height:38px;border-radius:10px;background:#fff;color:var(--blue-ink);display:grid;place-items:center;flex:none}
.dc .r i svg{width:19px;height:19px}
.dc .r b{display:block;font-size:15px;font-weight:600}
.dc .r span{display:block;font-size:13px;color:var(--muted)}
.dc .tm{display:flex;justify-content:flex-end;font-size:12px;color:var(--muted);padding:5px 2px 0}
/* long press: the message lifted over a dim layer, actions under it */
.lp{position:absolute;inset:0;background:rgba(14,27,61,.28);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;flex-direction:column;justify-content:center;padding:0 16px;gap:10px}
.lp .menu{background:#fff;border-radius:18px;overflow:hidden;width:250px;box-shadow:0 16px 40px rgba(14,27,61,.18)}
.lp .menu.r{align-self:flex-end}
.lp .menu div{display:flex;align-items:center;justify-content:space-between;height:48px;padding:0 16px;font-size:16px;border-bottom:1px solid var(--line)}
.lp .menu div:last-child{border-bottom:0}
.lp .menu svg{width:19px;height:19px;color:var(--muted)}
.lp .menu .dg{color:var(--red)}.lp .menu .dg svg{color:var(--red)}
.lp .menu small{font-size:12px;color:var(--muted);margin-left:auto;margin-right:10px}
/* menu sheet */
.mn{margin-top:6px}
.mn .opt{border-bottom:1px solid var(--line)}
.mn .opt.dg{color:var(--red)}
.mn .opt.dg i{background:#FDECEF;color:var(--red)}
.mn hr{border:0;height:8px}
/* search */
.sh{display:flex;align-items:center;gap:10px;padding:8px 16px 12px}
.sh .fld{box-shadow:0 10px 30px rgba(40,80,160,.08)}
.sh .fld svg{width:19px;height:19px;color:var(--muted);margin-left:8px}
.sh .cn{font-size:16px;font-weight:600;color:var(--blue-ink);flex:none}
mark{background:#FFE3A3;color:inherit;border-radius:4px;padding:0 2px}
.bb.d mark{background:#FFE3A3;color:var(--ink)}
.snav{display:flex;align-items:center;justify-content:space-between;height:52px;border-radius:26px;background:#fff;padding:0 8px 0 20px;font-size:16px;color:var(--muted);box-shadow:0 10px 30px rgba(40,80,160,.06)}
.snav span.b{display:flex;gap:6px}
.snav span.b i{width:38px;height:38px;border-radius:19px;background:var(--blue-fill);color:var(--blue-ink);display:grid;place-items:center}
.snav span.b i svg{width:19px;height:19px}
/* blocked */
.blk{height:52px;border-radius:26px;background:var(--grey-fill);display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;color:var(--muted)}
.blk b{color:var(--blue-ink);font-weight:600}
/* report sheet */
.rsn{display:flex;align-items:center;gap:12px;height:52px;border-bottom:1px solid var(--line);font-size:16px}
.rsn:last-of-type{border-bottom:0}
.rsn i{width:22px;height:22px;border-radius:11px;border:2px solid #C3CBDA;flex:none}
.rsn.on i{border:7px solid var(--blue)}
/* chat info page, WhatsApp-style */
.ip{min-height:852px;padding:0 16px 40px}
.ip .hd{margin-bottom:4px}
.idh{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px}
.idh .ava{height:112px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:12px}
.idh .ava img{max-height:112px;max-width:112px;width:auto;height:auto}
.idh b{font-size:24px;font-weight:600;letter-spacing:-.01em;line-height:1.2;padding:0 10px}
.idh span{font-size:15px;color:var(--muted)}
.tiles3{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:20px}
.tiles3 div{height:76px;background:#fff;border-radius:20px;box-shadow:0 10px 30px rgba(40,80,160,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font-size:15px;font-weight:500}
.tiles3 svg{width:22px;height:22px;color:var(--blue-ink)}
.gcard{background:#fff;border-radius:24px;box-shadow:0 10px 30px rgba(40,80,160,.08);margin-top:12px;padding:4px 16px}
.gcard .cap{font-size:14px;color:var(--muted);padding:12px 0 0}
.grow{display:flex;align-items:center;gap:14px;padding:12px 0}
.grow+.grow{border-top:1px solid var(--line)}
.grow i{width:44px;height:44px;border-radius:22px;background:var(--blue-fill);color:var(--blue-ink);display:grid;place-items:center;flex:none}
.grow i svg{width:20px;height:20px}
.grow .tx{flex:1;min-width:0}
.grow .tx b{display:block;font-size:17px;font-weight:600}
.grow .tx span{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.grow .tx span em{width:8px;height:8px;border-radius:4px;background:#22C17A}
.grow.dg{color:var(--red);font-size:17px;font-weight:500;gap:14px}
.grow.dg svg{width:21px;height:21px;margin:0 2px}
.mh{display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px}
.mh b{font-size:16px;font-weight:600}
.mh span{display:flex;align-items:center;gap:2px;font-size:15px;color:var(--muted)}
.mh span svg{width:17px;height:17px}
.thumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding-bottom:14px}
.thumbs .t{aspect-ratio:1;border-radius:14px;background:#F2F6FF;border:1px solid #AFC0D8;position:relative;overflow:hidden}
.thumbs .t svg.x{position:absolute;inset:0;width:100%;height:100%;stroke:#AFC0D8;stroke-width:.8}
.thumbs .t.pdf{background:var(--tile);border:0;display:grid;place-items:center;color:var(--blue-ink)}
.thumbs .t.pdf svg{width:24px;height:24px;margin-bottom:12px}
.thumbs .t.pdf small{position:absolute;bottom:8px;left:0;right:0;font-size:11px;font-weight:600;text-align:center}
/* media page */
.seg3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:rgba(255,255,255,.55);border-radius:22px;padding:4px;height:44px;margin:14px 0}
.seg3 .t{display:flex;align-items:center;justify-content:center;gap:6px;border-radius:18px;font-size:15px;font-weight:500;color:var(--muted)}
.seg3 .t b{font-weight:600;color:var(--ink)}
.seg3 .t.on{background:#6694F5;color:#fff;font-weight:600;box-shadow:0 6px 16px rgba(90,140,240,.3)}
.seg3 .t.on b{color:#fff}
/* link message */
.lk{align-self:flex-start;width:270px;background:#fff;border-radius:20px;border-bottom-left-radius:6px;padding:8px 8px 6px;box-shadow:0 6px 18px rgba(40,80,160,.06)}
.lk .pv{display:flex;gap:10px;align-items:center;background:var(--tile);border-radius:14px;padding:10px}
.lk .pv i{width:38px;height:38px;border-radius:10px;background:#fff;color:var(--blue-ink);display:grid;place-items:center;flex:none}
.lk .pv i svg{width:19px;height:19px}
.lk .pv b{display:block;font-size:15px;font-weight:600;line-height:1.3}
.lk .pv span{display:block;font-size:13px;color:var(--muted)}
.lk p{font-size:15px;color:var(--blue-ink);text-decoration:underline;padding:7px 4px 0;word-break:break-all;line-height:1.35}
.lk .tm{display:flex;justify-content:flex-end;font-size:12px;color:var(--muted);padding:3px 4px 0}
.thumbs .t.lnk{background:var(--tile);border:0;display:grid;place-items:center;color:var(--blue-ink)}
.thumbs .t.lnk svg{width:24px;height:24px;margin-bottom:12px}
.thumbs .t.lnk small{position:absolute;bottom:8px;left:0;right:0;font-size:11px;font-weight:600;text-align:center}

.mg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:6px}
.mg .t{aspect-ratio:1;border-radius:12px;background:#F2F6FF;border:1px solid #AFC0D8;position:relative;overflow:hidden}
.mg .t svg.x{position:absolute;inset:0;width:100%;height:100%;stroke:#AFC0D8;stroke-width:.8}
.mlab{font-size:14px;font-weight:500;color:var(--muted);margin:16px 4px 2px}
.drow{display:flex;align-items:center;gap:12px;background:#fff;border-radius:20px;padding:12px 14px;margin-top:8px;box-shadow:0 6px 18px rgba(40,80,160,.06)}
.drow i{width:42px;height:42px;border-radius:12px;background:var(--blue-fill);color:var(--blue-ink);display:grid;place-items:center;flex:none}
.drow i svg{width:20px;height:20px}
.drow .tx{flex:1}.drow b{display:block;font-size:16px;font-weight:600}.drow span{font-size:13px;color:var(--muted)}
</style>
</head>

});
/* ---------- data ---------- */
const N_NOTE='Ka temperaturë që mbrëmë dhe qan kur i prek veshin e djathtë.';
const A_NOTE='Kollë natën prej 4 ditësh, ka përdorur pompën 3 herë sot. Merr frymë me vështirësi pas vrapit.';
const ageT=c=>`${c.age[0]} vjeç &amp; ${c.age[1]} muaj`;

/* ---------- header ----------
   back, the child's name (opens the chat info) with the parent's presence dot, ⋯ for the menu. o.off: parent offline */
function chatHead(c,o={}){
  return `<div class="bh"><span class="back">${I('back')}</span><div class="bwho"><b>${c.name}<i class="pd ${o.off?'':'on'}"></i></b></div><span class="mbtn">${I('dots')}</span></div>`;
}
/* ---------- thread pieces ---------- */
const day=t=>`<div class="day">${t}</div>`;
const rquote=(who,txt)=>`<div class="qt"><b>${who}</b><span>${txt}</span></div>`;
const pMsg=(t,tm,q='')=>`<div class="bb p">${q}${t}<span class="tm">${tm}</span></div>`;
/* doctor message: tk 'sent' one tick, 'dlv' two ticks, 'seen' two mint ticks */
const tick=(tk,cls='')=>tk==='sent'?I('ck1'):I('ck2',tk==='seen'?'seen':'');
const dMsg=(t,tm,tk='seen',q='')=>`<div class="bb d">${q}${t}<span class="tm">${tm}${tick(tk)}</span></div>`;
const delMsg=tm=>`<div class="bb d del">${I('ban')}Ju e fshitë këtë mesazh<span class="tm">${tm}</span></div>`;
const uMsg=(tm,tk='seen')=>`<div class="bb u"><span class="lb2">${I('tri')}Këshillë për kujdes urgjent</span>Kjo mund të jetë urgjencë. Telefononi 112 tani ose shkoni te urgjenca më e afërt.<span class="tm">${tm}${tick(tk)}</span></div>`;
const photoMsg=tm=>`<div class="ph"><div class="im">${X()}</div><div class="tm">${tm}</div></div>`;
const LINK=['Hemogram i plotë','portal.laborator.al','https://portal.laborator.al/r/8KX42Q'];
const linkMsg=tm=>`<div class="lk"><div class="pv"><i>${I('link')}</i><div><b>${LINK[0]}</b><span>${LINK[1]}</span></div></div><p>${LINK[2]}</p><div class="tm">${tm}</div></div>`;
const docMsg=(n,s,tm)=>`<div class="dc"><div class="r"><i>${I('file')}</i><div><b>${n}</b><span>${s}</span></div></div><div class="tm">${tm}</div></div>`;
/* call: o.drop = ended by lost connection; o.last = the latest call, so it can be redialled */
const callCard=(dur,tm,o={})=>o.drop
  ?`<div class="ec"><div class="top"><i class="round amb">${I('vidoff')}</i><div class="tx"><b>Thirrja u ndërpre</b><span>${dur}</span></div></div><div class="tm">${tm}</div>${o.last?`<div class="act">${I('video')}Telefono përsëri</div>`:''}</div>`
  :`<div class="ec"><div class="top"><i class="round">${I('video')}</i><div class="tx"><b>Video-thirrje</b><span>${dur}</span></div></div><div class="tm">${tm}</div></div>`;
const fu=left=>`<div class="fu">${I('clock')}Prindi mund t’ju shkruajë edhe ${left}</div>`;
const resCard=(dx,tm)=>`<div class="ec"><div class="top"><i class="ok">${I('fchk')}</i><div class="tx"><b>Rezultati</b><span>${dx}</span></div></div><div class="tm">${tm}</div><div class="act">Hape${I('chev')}</div></div>`;
/* reschedule: o.st 'pend' | 'ok' | 'no' | 'none' */
function resched(o={}){
  const st=o.st||'pend';
  const time=st==='ok'?`<div class="tt"><b>Sot, 22:00</b></div>`:`<div class="tt"><s>Sot, 21:00</s>${I('arr')}<b>Sot, 22:00</b></div>`;
  const chip={pend:`<span class="chip c-pink">${I('clock')}Në pritje të prindit</span>`,ok:`<span class="chip c-green">${I('ck1')}Prindi pranoi</span>`,no:`<span class="chip c-grey">Prindi refuzoi</span>`,none:`<span class="chip c-grey">Pa përgjigje</span>`}[st];
  const q=st==='pend'?`<div class="q">Nëse prindi refuzon ose nuk përgjigjet para orës 21:00, konsulta anulohet.</div>`:(st==='no'||st==='none')?`<div class="q">Konsulta u anulua.</div>`:'';
  return `<div class="rs"><div class="in"><div class="h"><i>${I('cal')}</i>Kërkesë për riplanifikim</div>${time}${q}<div class="ft">${chip}<small>20:12</small></div></div>${st==='pend'?'<div class="act">Anulo kërkesën</div>':''}</div>`;
}
/* ---------- bottom ----------
   o.res: 'new' (Shkruaj rezultatin) | 'draft' (Vazhdo rezultatin) | false (result sent) ; o.text: messaging open before the result (text consultation) ; o.typed */
function bottom(o={}){
  const rb=o.res?`<div class="rbtn">${I('file')}${o.res==='draft'?'Vazhdo rezultatin':'Shkruaj rezultatin'}</div>`:'';
  const showCmp=!o.res||o.text;
  const val=o.typed?`<span class="val">${o.typed}<span class="caret"></span></span>`:'Shkruani prindit...';
  const cmp=showCmp?`<div class="cmp"><div class="fld"><span class="pl">${I('plus')}</span>${val}</div><span class="snd ${o.typed?'on':''}">${I('send')}</span></div>`:'';
  const rq=o.reply?`<div class="rbar">${rquote(o.reply[0],o.reply[1])}<span class="x2">${I('x')}</span></div>`:'';
  if(o.blocked)return `<div class="bot"><div class="blk">Keni bllokuar ${o.blocked}. <b>Zhblloko</b></div></div>`;
  return `<div class="bot">${rb}${rq}${cmp}</div>`;
}
/* ⋯ menu: o.sched adds Ripllanifikoni (scheduled consultations only) */
function menuSheet(c,o={}){
  const op=(ic,l,cls='')=>`<div class="opt ${cls}"><i>${I(ic)}</i>${l}</div>`;
  return bsheet(`<div class="stitle">Biseda</div><div class="mn">${op('search','Kërko në bisedë')}${o.sched?op('cal','Ripllanifikoni konsultën'):''}${op('tri','Këshilloni kujdes urgjent','dg')}</div>`);
}
const reportSheet=c=>bsheet(`<div class="stitle">Raportoni ${c.guardian[0]}</div><div class="ssub">Ekipi i Kidocare e shqyrton raportimin. Prindi nuk njoftohet.</div>
  ${['Sjellje fyese ose kërcënuese','Mesazhe të papërshtatshme','Informacion i rremë','Tjetër'].map((r,k)=>`<div class="rsn ${k===0?'on':''}"><i></i>${r}</div>`).join('')}
  <div class="btnb red">Dërgo raportimin</div>`);
const blockSheet=c=>bsheet(`<div class="stitle">Të bllokoni ${c.guardian[0]}?</div><div class="ssub" style="margin-bottom:0">Nuk do t’ju shkruajë më dhe nuk do t’ju zgjedhë për konsulta. Konsulta e hapur mbyllet. Mund ta zhbllokoni më vonë.</div>
  <div class="btnb red">Blloko</div><div class="btnb ghost">Anulo</div>`,false);
/* long press: the pressed message lifted, actions under it */
const lp=(msg,acts,right)=>`<div class="lp">${msg}<div class="menu ${right?'r':''}">${acts.map(([l,ic,dg,s])=>`<div class="${dg?'dg':''}">${l}${s?`<small>${s}</small>`:''}${I(ic)}</div>`).join('')}</div></div>`;
const attachSheet=()=>bsheet(`<div class="stitle">Dërgoni prindit</div><div style="margin-top:8px">
  <div class="opt"><i>${I('cam')}</i>Bëni një foto</div><div class="opt"><i>${I('imgs')}</i>Zgjidhni nga galeria</div><div class="opt"><i>${I('file')}</i>Dokument</div></div>`);
/* ---------- screens ---------- */
const chat=(c,head,thread,bot,over='')=>`<div class="cs bg">${statusBar()}${chatHead(c,head)}<div class="thread">${thread}</div>${bottom(bot)}${over}</div>`;
const N_Q='A t’i jap ibuprofen nëse temperatura rritet natën?';
const N_A='Ndiqni hapat te rezultati dhe më shkruani nëse temperatura nuk bie.';
const N_PEND=day('Sot')+pMsg(N_NOTE,'23:02')+callCard('9 min','23:14');
const N_SENT=N_PEND+resCard('Otit akut','23:31')+fu('24 orë')+pMsg(N_Q,'23:35');
const noaPend=(over)=>chat(NOA,{},N_PEND,{res:'new'},over);
const noaSent=(o={})=>chat(NOA,{},N_SENT+(o.more||''),o.bot||{},o.over);
const A_THREAD=day('Sot')+pMsg(A_NOTE,'23:12')+callCard('17 sek','23:20',{drop:1})+callCard('11 min','23:39');
const anisaFull=(over)=>chat(ANISA,{},A_THREAD,{res:'new'},over);
const cropc=h=>`<div class="cropc bg">${h}</div>`;
const headCrop=(c,o)=>`<div class="bg" style="padding-top:12px">${chatHead(c,o)}</div>`;
const botCrop=o=>`<div class="bg" style="padding-top:16px">${bottom(o)}</div>`;
/* search: header becomes the field, matches marked, bottom steps through them */
const searchScreen=()=>{
  const m=s=>s.replace(/temperatur/i,x=>`<mark>${x}</mark>`);
  const th=day('Sot')+pMsg(m(N_NOTE),'23:02')+callCard('9 min','23:14')+resCard('Otit akut','23:31')+fu('24 orë')+pMsg(m(N_Q),'23:35');
  return `<div class="cs bg">${statusBar()}<div class="sh"><div class="fld">${I('search')}<span class="val">temperatur<span class="caret"></span></span></div><span class="cn">Anulo</span></div><div class="thread">${th}</div><div class="bot"><div class="snav">2 nga 2<span class="b"><i>${I('up')}</i><i>${I('down')}</i></span></div></div></div>`;
};
/* chat info page, opened from the name: like a WhatsApp contact page */
function infoPage(c,o={}){
  const g=c.guardians[0];
  const media=o.media?`<div class="gcard"><div class="mh"><b>Foto, lidhje dhe dokumente</b><span>5${I('chev')}</span></div><div class="thumbs"><div class="t">${X()}</div><div class="t lnk">${I('link')}<small>Lidhje</small></div><div class="t pdf">${I('file')}<small>PDF</small></div><div class="t">${X()}</div></div></div>`:'';
  return `<div class="ip bg">${statusBar()}<div class="hd"><span class="back">${I('back')}</span></div>
   <div class="idh"><div class="ava"><img src="${c.avatar}" alt=""></div><b>${c.name}</b><span>${ageT(c)}</span></div>
   <div class="tiles3"><div>${I('steth')}Kartela mjekësore</div><div>${I('user')}Profili i fëmijës</div></div>
   ${media}
   <div class="gcard"><div class="cap">Prindi në bisedë</div><div class="grow"><i>${I('user')}</i><div class="tx"><b>${g[0]}</b><span>${g[1]}</span></div>${I('chev','chev')}</div></div>
   <div class="gcard"><div class="grow dg">${I('ban')}Bllokoni ${g[0]}</div><div class="grow dg">${I('flag')}Raportoni ${g[0]}</div></div>
   ${o.over||''}</div>`;
}
const mediaPage=(tab)=>{
  const body=tab===0?`<div class="mlab">Sot</div><div class="mg"><div class="t">${X()}</div><div class="t">${X()}</div></div><div class="mlab">Dje</div><div class="mg"><div class="t">${X()}</div></div>`
   :tab===1?`<div class="mlab">Dje</div><div class="drow"><i>${I('link')}</i><div class="tx"><b>${LINK[0]}</b><span>${LINK[1]}, 27.10</span></div>${I('chev','chev')}</div>`
   :`<div class="mlab">Dje</div><div class="drow"><i>${I('file')}</i><div class="tx"><b>IgE specifike.pdf</b><span>2 faqe, 27.10</span></div>${I('chev','chev')}</div>`;
  return `<div class="ip bg">${statusBar()}<div class="hd"><span class="back">${I('back')}</span><span class="t">Foto, lidhje dhe dokumente</span></div>
  <div class="seg3">${[['Foto',3],['Lidhje',1],['Dokumente',1]].map(([l,n],k)=>`<div class="t ${k===tab?'on':''}">${l} <b>${n}</b></div>`).join('')}</div>${body}</div>`;
};
const OWN=dMsg(N_A,'23:38','seen');
const F={
 'path-1':()=>noaPend(),
 'path-3':()=>noaSent(),
 'path-5':()=>infoPage(NOA),
 'path-6':()=>noaSent({over:menuSheet(NOA)}),
 'path-7':()=>searchScreen(),
 'path-8':()=>noaSent({over:urgSheet('')}),
 'path-9':()=>noaSent({more:uMsg('23:40')}),
 'path-10':()=>infoPage(NOA,{over:reportSheet(NOA)}),
 'path-11':()=>infoPage(NOA,{over:blockSheet(NOA)}),
 'path-12':()=>noaSent({more:OWN,over:lp(OWN,[['Përgjigju','reply'],['Kopjo','copy'],['Fshi','trash',1]],1)}),
 'path-13':()=>noaSent({over:attachSheet()}),
 'screen-min':()=>noaPend(),
 'screen-full':()=>anisaFull(),
 'head-on':()=>headCrop(NOA,{}),
 'head-off':()=>headCrop(NOA,{off:1}),
 'head-long':()=>headCrop(ANISA,{}),
 'info-min':()=>infoPage(NOA),
 'info-full':()=>infoPage(ANISA,{media:1}),
 'media-photo':()=>mediaPage(0),
 'media-link':()=>mediaPage(1),
 'media-doc':()=>mediaPage(2),
 'menu-min':()=>noaSent({over:menuSheet(NOA)}),
 'menu-sched':()=>anisaFull(menuSheet(ANISA,{sched:1})),
 'search':()=>searchScreen(),
 'urg-sheet':()=>noaPend(urgSheet('')),
 'urg-sent':()=>cropc(uMsg('23:40')),
 'report':()=>infoPage(NOA,{over:reportSheet(NOA)}),
 'block':()=>infoPage(NOA,{over:blockSheet(NOA)}),
 'blocked':()=>noaSent({bot:{blocked:'Klea Leka'}}),
 'tk-sent':()=>cropc(dMsg(N_A,'23:38','sent')),
 'tk-dlv':()=>cropc(dMsg(N_A,'23:38','dlv')),
 'tk-seen':()=>cropc(dMsg(N_A,'23:38','seen')),
 'msg-file':()=>cropc(photoMsg('22:51')+docMsg('IgE specifike.pdf','2 faqe','22:52')+linkMsg('22:53')),
 'lp-own':()=>noaSent({more:OWN,over:lp(OWN,[['Përgjigju','reply'],['Kopjo','copy'],['Fshi','trash',1]],1)}),
 'lp-parent':()=>noaSent({over:lp(pMsg(N_Q,'23:35'),[['Përgjigju','reply'],['Kopjo','copy']])}),
 'lp-file':()=>anisaFull(lp(docMsg('IgE specifike.pdf','2 faqe','22:52'),[['Përgjigju','reply'],['Ruaj në Kartela','save']])),
 'lp-link':()=>anisaFull(lp(linkMsg('22:53'),[['Hap lidhjen','ext'],['Përgjigju','reply'],['Kopjo lidhjen','copy'],['Ruaj në Kartela','save']])),
 'reply-bar':()=>botCrop({reply:['Klea Leka',N_Q],typed:'Ndiqni hapat te'}),
 'reply-msg':()=>cropc(pMsg(N_Q,'23:35')+dMsg(N_A,'23:38','seen',rquote('Klea Leka',N_Q))),
 'deleted':()=>cropc(delMsg('23:38')),
 'call-ok':()=>cropc(callCard('11 min','23:39')),
 'call-drop':()=>cropc(callCard('17 sek','23:20',{drop:1,last:1})),
 'call-drop-old':()=>cropc(callCard('17 sek','23:20',{drop:1})+callCard('11 min','23:39')),
 'res':()=>cropc(resCard('Otit akut','23:31')+fu('24 orë')),
 'res-long':()=>cropc(resCard('Infeksion viral i rrugëve të sipërme','23:31')+fu('3 orë')),
 'rs-pend':()=>cropc(resched({st:'pend'})),
 'rs-ok':()=>cropc(resched({st:'ok'})),
 'rs-no':()=>cropc(resched({st:'no'})),
 'rs-none':()=>cropc(resched({st:'none'})),
 'bot-video':()=>botCrop({res:'new'}),
 'bot-text':()=>botCrop({res:'new',text:1}),
 'bot-draft':()=>botCrop({res:'draft'}),
 'bot-empty':()=>botCrop({}),
 'bot-typed':()=>botCrop({typed:'Si është temperatura sot?'}),
 'attach':()=>noaSent({over:attachSheet()})
};
window.FRAME_IDS=Object.keys(F);
function show(){
  const id=location.hash.slice(1)||'path-1';
  document.getElementById('f').innerHTML=(F[id]||F['path-1'])();
  const post=()=>{try{parent.postMessage({liveFrame:id,h:document.getElementById('f').scrollHeight},'*')}catch(e){}};
  requestAnimationFrame(post);document.querySelectorAll('#f img').forEach(i=>i.complete||i.addEventListener('load',post));
}
addEventListener('hashchange',show);show();
document.fonts&&document.fonts.ready.then(show);
</script>
</body>
</html>
