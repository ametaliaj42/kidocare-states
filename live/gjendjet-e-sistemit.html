<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=393">
<title>Gjendjet e sistemit frames</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kidocare.css">
<style>
/* skeleton */
.sk{display:block;background:#E8EEF8;border-radius:8px;height:12px}
.skc{padding:18px 16px 16px}
.skr{display:flex;justify-content:space-between;margin-bottom:15px}
.skr .sk{height:12px}
.skt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}
.skt .sk{height:56px;border-radius:18px;background:#EDF2FA}
.skl{display:flex;align-items:center;gap:14px;padding:16px;border-radius:24px;background:#fff;box-shadow:0 10px 30px rgba(40,80,160,.08);margin-bottom:10px}
.skl .c{width:46px;height:46px;border-radius:23px;background:#EDF2FA;flex:none}
/* full-screen states: icon, title, one line, one button */
.st{display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 24px;margin-top:180px}
.st i{width:66px;height:66px;border-radius:33px;background:#fff;color:var(--blue-ink);display:grid;place-items:center;box-shadow:0 10px 24px rgba(40,80,160,.08);margin-bottom:22px}
.st i svg{width:26px;height:26px}
.st b{font-size:19px;font-weight:600;line-height:1.3}
.st p{font-size:15px;color:var(--muted);margin-top:6px}
.st .btn{margin-top:18px;height:41px;padding:0 22px;font-size:15px}
/* one section fails */
.secfail{display:flex;align-items:center;gap:12px;background:#fff;border-radius:24px;padding:14px 16px;box-shadow:0 10px 30px rgba(40,80,160,.08);font-size:15px;color:var(--muted);white-space:nowrap;gap:10px}
.secfail i{width:42px;height:42px;border-radius:21px;background:var(--amber-fill);color:var(--amber);display:grid;place-items:center;flex:none}
.secfail i svg{width:20px;height:20px}
.secfail span{flex:1}
.secfail b{color:var(--blue-ink);font-weight:600}
/* image fallback */
.file.fb{background:var(--grey-fill);border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted)}
.file.fb svg{width:20px;height:20px}
.file.fb b{position:static;background:none;color:var(--grey);height:auto;line-height:1}
.offchip{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 13px;border-radius:15px;background:rgba(255,255,255,.75);font-size:14px;font-weight:600;color:var(--muted);margin:-2px 0 10px}
.offchip svg{width:17px;height:17px}
</style>
</head>
<body>
<div id="f"></div>
<script src="kidocare.js"></script>
<script>
P.wifioff=P.wifioff||'<path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 4.17-2.65"/><path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/><path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"/><path d="M5 13a10 10 0 0 1 5.24-2.76"/><path d="m2 2 20 20"/>';
P.userx='<circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 12.5-4.3"/><path d="m17 15 5 5M22 15l-5 5"/>';
const bar=w=>`<span class="sk" style="width:${w}px"></span>`;
function skeleton(){
  return `<div class="page bg">${statusBar()}${header('Kartela mjekësore')}<h2 class="sec">Gjeneralitetet</h2>
   <div class="card skc">${[0,1,2,3].map(()=>`<div class="skr">${bar(80)}${bar(66)}</div>`).join('')}<div class="skt"><span class="sk"></span><span class="sk"></span><span class="sk"></span></div></div>
   <h2 class="sec" style="margin-top:28px">Historiku mjekësor</h2><div class="sk" style="height:47px;border-radius:24px;background:rgba(255,255,255,.65);margin-bottom:14px"></div>
   ${[0,1,2].map(()=>`<div class="skl"><span class="c"></span><div style="flex:1;display:grid;gap:8px">${bar(150)}${bar(90)}</div></div>`).join('')}</div>`;
}
const state=(title,icon,t,p,btn)=>`<div class="page bg">${statusBar()}${header(title)}<div class="st"><i>${I(icon)}</i><b>${t}</b><p>${p}</p><span class="btn">${btn}</span></div></div>`;
const secfail=t=>`<div class="secfail"><i>${I('alert')}</i><span>${t}</span><b>Provoni përsëri</b></div>`;
function thumbFallback(t){
  return testCard(t).replace(/<div class="file">[\s\S]*?<\/b><\/div>/,`<div class="file fb">${I('file')}<b>${t.k}</b></div>`);
}
const F={
 'sys-loading':()=>skeleton(),
 'sys-offline':()=>state('Kartela mjekësore','wifioff','Pa lidhje me internetin','Kartela do të hapet sapo të lidheni përsëri.','Provoni përsëri'),
 'sys-error':()=>state('Kartela mjekësore','alert','Kartela nuk u hap','Diçka nuk shkoi mirë nga ana jonë.','Provoni përsëri'),
 'sys-gone':()=>state('Profili i fëmijës','userx','Ky profil nuk është më i disponueshëm','Prindi e ka fshirë profilin e fëmijës.','Kthehu te biseda'),
 'sys-sec-pf':()=>crop(clinical(ANISA.chronic,ANISA.current)+`<div style="margin-top:20px">${secfail('Konsultat nuk u ngarkuan')}</div>`),
 'sys-sec-tab':()=>crop(`<h2 class="sec">Historiku mjekësor</h2>${tabs(ANISA,2)}${secfail('Analizat nuk u ngarkuan')}`),
 'sys-thumb':()=>crop(thumbFallback(ANISA.tests[1])+testCard(ANISA.tests[2])),
 'sys-avatar':()=>crop(idCard({...ANISA,avatar:'img/monkey.png'})),
 'sys-cached':()=>profile(ANISA).replace('<div class="card idc">',`<span class="offchip">${I('wifioff')}Pa lidhje. Përditësuar më 14:20</span><div class="card idc">`),
 'test-det-err':()=>fileOverlay(ANISA.tests[3],{err:1})
};
window.FRAME_IDS=Object.keys(F);
function show(){
  const id=location.hash.slice(1)||'sys-loading';
  document.getElementById('f').innerHTML=(F[id]||F['sys-loading'])();
  const post=()=>{try{parent.postMessage({liveFrame:id,h:document.getElementById('f').scrollHeight},'*')}catch(e){}};
  requestAnimationFrame(post);document.querySelectorAll('#f img').forEach(i=>i.complete||i.addEventListener('load',post));
}
addEventListener('hashchange',show);show();
document.fonts&&document.fonts.ready.then(show);
</script>
</body>
</html>
