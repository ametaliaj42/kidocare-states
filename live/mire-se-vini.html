<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=393">
<title>Mirë se vini frames</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Self-contained: the landing does not load kidocare.css, so its class names cannot clash with the shared ones. Tokens are the same. */

:root{--ink:#0E1B3D;--muted:#5E6C8A;--blue:#5B96FF;--blue-ink:#2F6FE0;--blue-fill:#E9F2FF;--green:#1A9E63;--amber:#94600E;--amber-fill:#FFF3D1;--red:#D94862;--line:#E6EDF8;--font:"Outfit",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:393px;overflow:hidden}
body{font:400 16px/1.3 var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;background:linear-gradient(180deg,#EEF4FD 0%,#DCE6FA 100%);position:relative}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- the wall: three depths ---------- */
.hero{position:absolute;left:0;right:0;top:0;height:580px;overflow:hidden}
.layer{position:absolute;inset:0}
.wall{position:absolute;display:flex;align-items:flex-start;transform:rotate(-8deg);transform-origin:50% 40%;animation:in 1.6s cubic-bezier(.2,.8,.2,1) both}
.col{display:flex;flex-direction:column;will-change:transform;animation:slide linear infinite}
.col .set{display:flex;flex-direction:column}
@keyframes slide{from{transform:translate3d(0,0,0)}to{transform:translate3d(0,-33.3333%,0)}}
@keyframes in{from{opacity:0;transform:rotate(-8deg) translateY(60px)}to{opacity:1;transform:rotate(-8deg)}}
/* back: small, soft, slow */
.back .wall{left:-30px;top:-60px;gap:22px}
.back .wall{animation:inB 1.6s cubic-bezier(.2,.8,.2,1) both}
@keyframes inB{from{opacity:0}to{opacity:1}}
.back .col{width:112px;zoom:.78}.back .set{gap:22px;padding-bottom:22px}
.back{filter:blur(3.2px) saturate(.8);opacity:.34}
/* middle: the readable cards */
.mid .wall{left:-40px;top:-30px;gap:29px}
.mid .col{width:150px}.mid .set{gap:24px;padding-bottom:24px}
/* front: a few objects passing close to the eye */
.front{pointer-events:none}
.front .wall{left:-10px;top:0;gap:120px}
.front .col{width:120px}.front .set{gap:230px;padding-bottom:230px}
.front .obj{filter:drop-shadow(0 26px 22px rgba(30,70,160,.30))}
.hero::before{content:"";position:absolute;left:0;right:0;top:0;height:175px;z-index:5;background:linear-gradient(180deg,#EEF4FD 60%,rgba(238,244,253,0))}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:160px;z-index:5;background:linear-gradient(180deg,rgba(226,234,251,0),#E2EAFB 80%)}

/* pieces: deliberately different formats */
.card{border-radius:20px;background:linear-gradient(160deg,rgba(255,255,255,.95),rgba(255,255,255,.72));border:1px solid rgba(255,255,255,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 #fff,0 22px 40px -14px rgba(40,80,160,.30),0 3px 8px rgba(40,80,160,.06)}
.photo{position:relative;border-radius:20px;background-size:cover;background-position:center 15%;box-shadow:0 26px 44px -16px rgba(30,60,140,.40),0 4px 10px rgba(30,60,140,.08);overflow:hidden;outline:1px solid rgba(255,255,255,.6);outline-offset:-1px}
.photo .tag{position:absolute;left:8px;right:8px;bottom:8px;display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:13px;background:rgba(255,255,255,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:12.5px;font-weight:600;white-space:nowrap}
.photo .tag i{width:7px;height:7px;border-radius:4px;background:#22C17A;flex:none}
.obj{height:110px;background-size:contain;background-repeat:no-repeat;background-position:center;filter:drop-shadow(0 16px 18px rgba(40,80,160,.22))}

.time{padding:14px 14px 13px}
.time .big{font-size:30px;font-weight:600;letter-spacing:-.02em;color:var(--blue-ink);line-height:1}
.time .big span{font-size:18px;color:var(--muted);font-weight:500;letter-spacing:0}
.time small{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--muted);margin-top:6px}

.price{padding:12px 14px;display:flex;align-items:baseline;gap:5px;width:122px}
.price b{font-size:24px;font-weight:600;letter-spacing:-.01em}
.price small{font-size:13px;color:var(--muted)}
.price em{font-style:normal;font-size:13px;color:var(--muted);margin-right:-2px}

.chat{display:flex;flex-direction:column;gap:8px;width:150px}
.bub{position:relative;max-width:132px;padding:9px 12px 8px;border-radius:18px;font-size:13.5px;line-height:1.3}
.bub small{display:flex;justify-content:flex-end;gap:3px;align-items:center;font-size:10.5px;margin-top:2px;opacity:.8}
.bub.p{align-self:flex-end;color:#fff;border-bottom-right-radius:6px;
  background:linear-gradient(150deg,#7EAEFF 0%,#5B96FF 45%,#3F7BEE 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -6px 12px rgba(30,70,180,.18),0 18px 30px -12px rgba(60,120,240,.55)}
.drow{display:flex;align-items:flex-end;gap:5px}
.drow .av{width:22px;height:22px;border-radius:14px;background-size:cover;background-position:center 20%;border:2px solid #fff;flex:none;box-shadow:0 6px 12px rgba(30,60,140,.18)}
.bub.d{color:var(--ink);border-bottom-left-radius:6px;background:linear-gradient(160deg,rgba(255,255,255,.75),rgba(233,242,255,.55));
  border:1px solid rgba(255,255,255,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:inset 0 1px 0 #fff,0 18px 30px -12px rgba(40,80,160,.35)}
.bub.d small{color:var(--muted)}
.call{height:206px}
.call .tm{position:absolute;left:8px;top:8px;padding:4px 9px;border-radius:11px;background:rgba(14,27,61,.45);color:#fff;font-size:12px;font-weight:500;backdrop-filter:blur(6px)}
.call .me{position:absolute;right:8px;top:8px;width:46px;height:62px;border-radius:11px;background:url(img/doc-call.jpg) center 30%/cover;border:2px solid rgba(255,255,255,.95);box-shadow:0 8px 16px rgba(14,27,61,.28)}
.call .ctl{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:8px}
.call .ctl span{width:32px;height:32px;border-radius:16px;display:grid;place-items:center;background:rgba(255,255,255,.85);color:var(--ink)}
.call .ctl span.end{background:var(--red);color:#fff}
.call .ctl svg{width:15px;height:15px}

.ver{display:flex;align-items:center;gap:9px;padding:12px 14px 12px 12px;border-radius:18px;font-size:14.5px;font-weight:600;line-height:1.2;width:150px}
.ver i{width:22px;height:22px;border-radius:11px;background:var(--green);color:#fff;display:grid;place-items:center}
.ver svg{width:13px;height:13px;stroke-width:2.6}

.crowd{padding:13px 14px}
.faces{display:flex}
.faces span{width:34px;height:34px;border-radius:17px;border:2.5px solid #fff;background-size:cover;background-position:center 20%;margin-right:-10px}
.crowd b{display:block;font-size:20px;font-weight:600;margin-top:9px;letter-spacing:-.01em}
.crowd small{font-size:13px;color:var(--muted)}

.res{padding:12px 13px 13px}
.res .h{display:flex;align-items:center;gap:8px}
.res .ck{width:28px;height:28px;border-radius:14px;background:#E2F5EA;color:var(--green);display:grid;place-items:center}
.res small{display:block;font-size:11.5px;color:var(--muted);line-height:1.1}
.res .dx{font-size:15px;font-weight:600}
.res ol{list-style:none;margin-top:9px;padding-top:8px;border-top:1px solid var(--line);font-size:12.5px;line-height:1.35}
.res ol li{display:flex;gap:4px;margin-bottom:3px}.res ol b{color:var(--blue-ink);font-weight:600}
.res .w{margin-top:6px;padding:5px 8px;border-radius:9px;background:var(--amber-fill);color:var(--amber);font-size:12px;font-weight:500}

.lang-card{padding:13px 14px}
.lang-card .q{font-size:22px;font-weight:600;letter-spacing:-.01em;line-height:1.05}
.lang-card .q span{color:var(--blue-ink)}
.lang-card small{display:block;font-size:13px;color:var(--muted);margin-top:6px}

/* ---------- still part ---------- */
.sb{position:relative;z-index:5;height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 26px 0 30px;font-weight:600;font-size:16px}
.sb .ic{display:flex;gap:6px;align-items:center}
.sig{display:flex;gap:2px;align-items:flex-end;height:11px}.sig i{width:3px;background:var(--ink);border-radius:1px}
.bat{width:25px;height:12px;border:1.5px solid var(--ink);border-radius:4px;position:relative}.bat::after{content:"";position:absolute;inset:1.5px;background:var(--ink);border-radius:1.5px}
.top{position:relative;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:6px 20px 0}
.top img{height:22px}
.lang{display:flex;background:rgba(255,255,255,.8);border-radius:20px;padding:3px}
.lang b{font-size:14px;font-weight:600;padding:7px 13px;border-radius:17px;color:var(--muted)}.lang b.on{background:var(--blue);color:#fff}
.content{position:absolute;left:20px;right:20px;top:592px;z-index:5}
h1{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.12}h1 span{color:var(--blue-ink)}
.cta{position:absolute;left:20px;right:20px;top:700px;z-index:5}
.btn{height:56px;border-radius:18px;background:var(--blue);color:#fff;font-size:17px;font-weight:600;display:grid;place-items:center;box-shadow:0 12px 28px rgba(80,140,250,.35)}
.login{text-align:center;margin-top:14px;font-size:16px;color:var(--muted)}.login b{color:var(--blue-ink);font-weight:600}
.ped{position:absolute;left:0;right:0;bottom:26px;z-index:5;text-align:center;font-size:14.5px;color:var(--muted);display:flex;justify-content:center;align-items:center;gap:4px}
.hi{position:absolute;bottom:8px;left:50%;width:134px;height:5px;border-radius:3px;background:var(--ink);transform:translateX(-50%);z-index:5}
.content,.cta,.ped{animation:up .9s cubic-bezier(.2,.8,.2,1) both}
.content{animation-delay:.5s}.cta{animation-delay:.65s}.ped{animation-delay:.8s}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.col,.wall,.content,.cta,.ped{animation:none!important}}

.cta2{position:absolute;left:20px;right:20px;z-index:5}
.b1{height:56px;border-radius:18px;background:var(--blue);color:#fff;font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 12px 28px rgba(80,140,250,.35)}
.b2{height:56px;border-radius:18px;background:rgba(255,255,255,.9);color:var(--blue-ink);font-size:17px;font-weight:600;display:grid;place-items:center;box-shadow:0 8px 20px rgba(40,80,160,.08)}
.b1 svg{width:20px;height:20px}
.lbl{position:absolute;left:0;right:0;top:-1px;z-index:99;text-align:center;font:600 13px Outfit;color:#fff;background:#0E1B3D;padding:4px}

#f{width:393px}
.lw{position:relative;width:393px;height:852px;overflow:hidden;background:linear-gradient(180deg,#EEF4FD 0%,#DCE6FA 100%)}
.lw .lg{height:22px}
.lw.still .col,.lw.still .wall,.lw.still .content,.lw.still .cta2{animation:none!important}
.lw.en h1{font-size:29px}
.lw.wallonly{height:580px}.lw.wallonly .content,.lw.wallonly .cta2,.lw.wallonly .hi{display:none}
.lcrop{padding:18px 20px 20px;background:linear-gradient(180deg,#EEF4FD 0%,#DCE6FA 100%)}
.lcrop .lang{display:inline-flex}
.lcrop .cta2{position:static}
.lcrop .content{position:static;animation:none!important;opacity:1}
.lcrop .cta2{animation:none!important;opacity:1}

</style>
</head>
<body>
<div id="f"></div>
<script>
const ic={
 moon:'<path d="M19 14A7.5 7.5 0 1 1 10 5a6 6 0 0 0 9 9z"/>',
 check:'<path d="M6 12.5l4 4 8-9"/>',
 mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>',
 cam:'<rect x="3" y="7" width="12" height="10" rx="2"/><path d="M15 11l6-3v8l-6-3"/>',
 end:'<path d="M3 14.5c5-4.5 13-4.5 18 0l-2.5 2.5-3-1.5v-2.5a10 10 0 0 0-7 0v2.5l-3 1.5z"/>',
};
const s=(k,st='')=>`<svg class="i" viewBox="0 0 24 24" ${st}>${ic[k]}</svg>`;
/* all copy in both languages */
const T={
 sq:{eve:'çdo mbrëmje',from:'nga',per:'/ konsultë',m1:'Ema ka 38.5°C që në mëngjes.',m2:'Mirëmbrëma! Po ju telefonoj tani.',video:'Video',vsub:'ose me shkrim',ver:'Pediatër të licencuar',crowd:'pediatër në Kidocare',res:'Rezultati',dx:'Otit akut',s1:'Ibuprofen sipas peshës',s2:'Kontroll pas 3 ditësh',w:'Kujdes nëse kalon 39°C',q1:'Mirëmbrëma,',q2:'si është Ema?',qs:'Gjithçka në shqip',
     h1:'Kujdes pediatrik i besuar, shpejt, <span>në shqip.</span>',b1:'Krijo llogari',b2:'Hyr'},
 en:{eve:'every evening',from:'from',per:'/ consult',m1:'Ema has had 38.5°C since morning.',m2:'Good evening! I am calling you now.',video:'Video',vsub:'or by text',ver:'Licensed pediatricians',crowd:'pediatricians on Kidocare',res:'Result',dx:'Acute otitis',s1:'Ibuprofen by weight',s2:'Check-up in 3 days',w:'Watch for fever over 39°C',q1:'Good evening,',q2:'how is Ema?',qs:'All in Albanian',
     h1:'Trusted pediatric care, fast, <span>in Albanian.</span>',b1:'Create account',b2:'Log in'},
};
function pieces(t){return {
 time:`<div class="card time"><div class="big">19:00<span>–23:00</span></div><small>${s('moon','style="width:14px;height:14px"')}${t.eve}</small></div>`,
 price:`<div class="card price"><em>${t.from}</em><b>€8</b><small>${t.per}</small></div>`,
 chat:`<div class="chat"><div class="bub p">${t.m1}<small>21:14 ✓✓</small></div><div class="drow"><span class="av" style="background-image:url(img/doc-2.jpg)"></span><div class="bub d">${t.m2}<small>21:15</small></div></div></div>`,
 video:`<div class="card time"><div class="big">${t.video}</div><small>${t.vsub}</small></div>`,
 call:`<div class="photo call" style="background-image:url(img/landing-call.jpg);background-position:center 30%;height:232px"><span class="tm">04:12</span><span class="me"></span><div class="ctl"><span>${s('mic')}</span><span>${s('cam')}</span><span class="end">${s('end')}</span></div></div>`,
 ver:`<div class="card ver"><i>${s('check')}</i>${t.ver}</div>`,
 crowd:`<div class="card crowd"><div class="faces"><span style="background-image:url(img/doc-1.jpg)"></span><span style="background-image:url(img/doc-5.jpg)"></span><span style="background-image:url(img/doc-2.jpg)"></span></div><b>120+</b><small>${t.crowd}</small></div>`,
 res:`<div class="card res"><div class="h"><div class="ck">${s('check','style="width:14px;height:14px"')}</div><div><small>${t.res}</small><div class="dx">${t.dx}</div></div></div><ol><li><b>1.</b>${t.s1}</li><li><b>2.</b>${t.s2}</li></ol><div class="w">${t.w}</div></div>`,
 shqip:`<div class="card lang-card"><div class="q">${t.q1}<br><span>${t.q2}</span></div><small>${t.qs}</small></div>`,
}}
function wall(t){
 const P=pieces(t);
 const cols=[[46,[P.time,P.chat,P.price]],[52,[P.call,P.ver,P.crowd],1],[49,[P.res,P.video,P.shqip]]];
 return `<div class="wall">${cols.map(([dur,items,rev],i)=>{const set=`<div class="set">${items.join('')}</div>`;
   return `<div class="col" style="animation-duration:${dur}s;animation-delay:-${(i*7+3)%dur}s;${rev?'animation-direction:reverse;':''}">${set}${set}${set}</div>`}).join('')}</div>`;
}
const SB=`<div class="sb"><span>9:41</span><div class="ic"><div class="sig"><i style="height:4px"></i><i style="height:6px"></i><i style="height:8px"></i><i style="height:11px"></i></div><svg class="i" viewBox="0 0 24 24" style="width:17px;height:17px"><path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/></svg><div class="bat"></div></div></div>`;
const langSw=l=>`<div class="lang"><b class="${l==='sq'?'on':''}">AL</b><b class="${l==='en'?'on':''}">EN</b></div>`;
const ctas=t=>`<div class="cta2" style="top:688px"><div class="b1">${t.b1}</div><div class="b2" style="margin-top:12px">${t.b2}</div></div>`;
function landing(l='sq',cls=''){
 const t=T[l];
 return `<div class="lw ${cls} ${l}"><div class="hero"><div class="layer mid">${wall(t)}</div></div>${SB}
  <div class="top"><img class="lg" src="img/logo-kidocare.png" alt="KidoCare">${langSw(l)}</div>
  <div class="content"><h1>${t.h1}</h1></div>${ctas(t)}<div class="hi"></div></div>`;
}
const F={
 'path-1':()=>landing(),
 'screen-min':()=>landing(),
 'screen-still':()=>landing('sq','still'),
 'wall-anim':()=>landing('sq','wallonly'),
 'wall-still':()=>landing('sq','wallonly still'),
 'lang-sq':()=>`<div class="lcrop">${langSw('sq')}</div>`,
 'lang-en':()=>`<div class="lcrop">${langSw('en')}</div>`,
 'screen-en':()=>landing('en'),
 'cta-sq':()=>`<div class="lcrop"><div class="content"><h1>${T.sq.h1}</h1></div><div style="height:24px"></div>${ctas(T.sq).replace(' style="top:688px"','')}</div>`,
 'cta-en':()=>`<div class="lcrop"><div class="content"><h1>${T.en.h1}</h1></div><div style="height:24px"></div>${ctas(T.en).replace(' style="top:688px"','')}</div>`,
};
window.FRAME_IDS=Object.keys(F);
function show(){
  const id=location.hash.slice(1)||'path-1';
  document.getElementById('f').innerHTML=(F[id]||F['path-1'])();
  /* the still frames show the wall at rest, as phones with reduced motion do */
  const post=()=>{try{parent.postMessage({liveFrame:id,h:document.getElementById('f').scrollHeight},'*')}catch(e){}};
  requestAnimationFrame(post);document.querySelectorAll('#f img').forEach(i=>i.complete||i.addEventListener('load',post));
}
addEventListener('hashchange',show);show();
document.fonts&&document.fonts.ready.then(show);
</script>
</body>
</html>
